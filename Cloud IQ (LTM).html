<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud IQ — Infrastructure Tech Advisory</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* LTM design system — palette, typography and spacing lifted from the sibling
   accelerators (Sovereign IQ, Posture IQ, FinOps IQ, FinOps Value Case). */
@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap");
:root{
  --ground:#F9F9F9; --panel:#FFFFFF; --panel2:#F5F5F5;
  --line:#DADADA; --line2:#ECECEC;
  --ink:#282828; --mut:#5B5B5B; --mutd:#8E8E8E;
  --coral:#FF5E4F; --coral-dk:#E54536; --coral-dkr:#CC2B1C; --coral-tint:#FCF0EE;
  --blue:#226882; --violet:#482475; --amber:#B8860B; --green:#35754D;
  --radius-sm:4px; --radius-md:8px; --radius-lg:16px;
  --shadow-card:0 1px 2px rgba(40,40,40,.06), 0 4px 12px rgba(40,40,40,.08);
  --font-display:"Manrope","Segoe UI",Arial,sans-serif;
  --font-body:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--ground);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}

/* header */
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ltmlogo{display:flex;align-items:center;gap:12px}
.ltmlogo>img{height:26px;width:auto;object-fit:contain;flex:none}
.ltmword{line-height:1.15;border-left:1px solid var(--line);padding-left:12px}
.ltmword b{font-family:var(--font-display);font-size:14px;font-weight:600;display:block;color:var(--ink)}
.ltmword span{display:block;font-family:var(--font-display);font-size:10px;letter-spacing:.12em;color:var(--mutd);text-transform:uppercase;margin-top:2px}
.kicker{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}

/* progress */
.progress-bar{height:3px;background:var(--line2)}
.progress-fill{height:3px;background:var(--coral);width:0;transition:width .3s}

/* cards */
.screen{padding:36px 0 64px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;box-shadow:var(--shadow-card)}
h1{font-size:36px;font-weight:700;line-height:1.15;margin-bottom:10px}
h2{font-size:22px;font-weight:600;margin-bottom:14px}
h3{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);margin:0 0 10px}
.lead{font-size:16px;color:var(--mut);margin-bottom:18px}
.pill{display:inline-block;background:var(--coral-tint);color:var(--coral-dkr);border-radius:var(--radius-pill,999px);padding:5px 12px;font-size:12px;font-weight:600;margin:0 6px 6px 0;font-family:var(--font-display)}
.eyebrow,.sec-label{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);margin-bottom:8px}
.qtext{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--ink);margin-bottom:4px}
.qhint{font-size:13px;color:var(--mutd);margin-bottom:18px}

/* option buttons */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;cursor:pointer;background:var(--panel);font-size:15px;transition:.15s;display:flex;align-items:center;gap:12px}
.opt:hover{border-color:var(--coral);background:var(--coral-tint)}
.opt.sel{border-color:var(--coral);background:var(--coral-tint);font-weight:600}
.opt .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.opt.multi .mark{border-radius:5px}
.opt.sel .mark{border-color:var(--coral);background:var(--coral)}
.opt.sel .mark::after{content:'✓';color:#fff;font-size:12px;font-weight:bold}
.opt .sub{display:block;font-size:12px;color:var(--mutd);font-weight:400}

.scen{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scen .opt{flex-direction:column;align-items:flex-start;text-align:left}
.scen .opt .tag{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--coral);letter-spacing:.12em}

.slider-wrap{padding:10px 4px}
.slider-wrap input[type=range]{width:100%;accent-color:var(--coral)}
.slider-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--mutd);margin-top:8px;font-family:var(--font-display)}
.slider-val{text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--coral);margin:10px 0}

.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item{border:1.5px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;background:var(--panel);cursor:grab;display:flex;align-items:center;gap:12px;font-size:15px}
.rank-item.dragging{opacity:.4}
.rank-item .num{width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex:0 0 auto}
.rank-item .grip{color:var(--mutd);margin-left:auto;font-size:18px}

.tf{display:flex;gap:12px}
.tf .opt{flex:1;justify-content:center;font-weight:600}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.btn{background:var(--coral);color:#fff;border:none;border-radius:var(--radius-md);padding:13px 28px;font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;transition:.15s;letter-spacing:.01em}
.btn:hover{background:var(--coral-dk)}
.btn:disabled{background:var(--line);color:var(--mutd);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--coral);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--coral-tint);color:var(--coral-dkr);border-color:var(--coral)}
.btn.big{padding:16px 40px;font-size:17px}
.qcount{font-family:var(--font-display);font-size:13px;color:var(--mutd)}

/* results */
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.badge{display:inline-block;padding:6px 14px;border-radius:var(--radius-pill,999px);font-family:var(--font-display);font-weight:700;font-size:14px;color:#fff;background:var(--coral)}
.band-scale{display:flex;gap:4px;margin-top:12px}
.band-seg{flex:1;text-align:center;font-family:var(--font-display);font-size:10px;font-weight:600;padding:6px 2px;border-radius:var(--radius-sm);background:var(--panel2);color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.band-seg.on{background:var(--coral);color:#fff}
.dimrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dimrow .dname{width:200px;font-size:12px;color:var(--mut);font-family:var(--font-display);font-weight:500}
.dimbar{flex:1;background:var(--panel2);border-radius:var(--radius-sm);height:12px;overflow:hidden}
.dimbar .fill{height:12px;background:var(--coral);border-radius:var(--radius-sm)}
.dimrow .dval{width:34px;text-align:right;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--ink)}
.move{border-left:4px solid var(--coral);background:var(--panel2);padding:14px 18px;border-radius:0 var(--radius-md) var(--radius-md) 0;margin-bottom:10px}
.move .mtitle{font-family:var(--font-display);font-weight:700;color:var(--ink);margin-bottom:2px}
.move .mmeta{font-size:12px;color:var(--mut)}
.offer{border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;margin-bottom:10px;background:var(--panel)}
.offer .ocode{font-family:var(--font-display);font-weight:700;color:var(--coral)}
.offer .odoor{font-size:12px;color:var(--green);font-weight:600;margin-top:4px;font-family:var(--font-display)}
.handoff{background:var(--coral-tint);border:1px dashed var(--coral);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;color:var(--ink)}
.valuehook{background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:26px;text-align:center}
.valuehook .big{font-family:var(--font-display);font-size:38px;font-weight:800;color:var(--coral);letter-spacing:-.01em}
.valuehook .lbl{font-family:var(--font-display);font-size:12px;color:var(--mutd);letter-spacing:.16em;text-transform:uppercase}
footer.foot{text-align:center;color:var(--mutd);font-size:12px;padding:28px 0 44px;font-family:var(--font-display);letter-spacing:.02em}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chip-journey{padding:10px 14px;border-radius:var(--radius-md);font-family:var(--font-display);font-size:13px;font-weight:600;margin-bottom:8px}
.chip-primary{background:var(--coral);color:#fff}
.chip-secondary{background:var(--coral-tint);color:var(--coral-dkr);border:1px solid var(--coral)}
.stage-flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 10px;font-family:var(--font-display);font-size:12px;color:var(--mut)}
.stage.cur{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
@media(max-width:720px){.res-grid,.scen,.two-col{grid-template-columns:1fr}.dimrow .dname{width:130px}}
.qblock{padding:20px 0;border-bottom:1px solid var(--line2)}
.qblock:first-child{padding-top:4px}
.qblock:last-child{border-bottom:none;padding-bottom:0}
.resume{background:var(--coral-tint);border:1px solid var(--coral);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.resume span{font-family:var(--font-display);font-weight:600;color:var(--coral-dkr);font-size:13px;flex:1}
.resume button{font-family:var(--font-display);font-size:12px;font-weight:600;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--coral);background:var(--panel);color:var(--coral-dkr)}
.resume button.primary{background:var(--coral);color:#fff;border-color:var(--coral)}
</style>
</head>

/* ============================================================
   State
   ============================================================ */
let gIdx=0;                           // current group card index
const A={};                           // answers keyed by qid
const app=document.getElementById('app');
const pfill=document.getElementById('pfill');
const STORE_KEY="cloudiq.v1.state";

function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({gIdx:gIdx, A:A, ts:Date.now()})); }catch(e){} }
function loadState(){
 try{
  const raw=localStorage.getItem(STORE_KEY); if(!raw) return null;
  const st=JSON.parse(raw); if(!st||!st.A||typeof st.gIdx!=="number") return null;
  return st;
 }catch(e){ return null; }
}
function clearState(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function hydrate(st){ Object.keys(A).forEach(k=>delete A[k]); Object.assign(A, st.A||{}); gIdx=st.gIdx||0; }

/* ============================================================
   Render engine
   ============================================================ */
function start(){
 const st=loadState();
 let resumeHtml="";
 if(st && (st.gIdx>0 || Object.keys(st.A||{}).length>0)){
  const pct = Math.round((st.gIdx/GROUPS.length)*100);

 }

function begin(){ clearState(); Object.keys(A).forEach(k=>delete A[k]); gIdx=0; renderGroup(); }
function resumeSaved(){ const st=loadState(); if(!st){ begin(); return; } hydrate(st); renderGroup(); }
function startFresh(){ clearState(); begin(); }

function renderGroup(){
 const G=GROUPS[gIdx];
 pfill.style.width=((gIdx)/GROUPS.length*100)+"%";
 const parts=G.qs.map(qid=>{
  const Q=QUESTIONS.find(x=>x.id===qid);
  if(shouldSkip(Q)) return "";
  let body="";
  if(Q.type==="single") body=renderSingle(Q);
  else if(Q.type==="multi") body=renderMulti(Q);
  else if(Q.type==="cards") body=renderCards(Q);
  else if(Q.type==="slider") body=renderSlider(Q);
  else if(Q.type==="rank") body=renderRank(Q);
  else if(Q.type==="tf") body=renderTF(Q);
  const meta=Q.dim?` <span style="color:var(--mutd);font-size:11px;font-weight:500;letter-spacing:.08em">· ${Q.dim}</span>`:"";
  return `<div class="qblock"><div class="qtext">${Q.q}${meta}</div><div class="qhint">${Q.hint||"&nbsp;"}</div>${body}</div>`;
 }).join("");
 const answered=G.qs.every(qid=>{const Q=QUESTIONS.find(x=>x.id===qid);return shouldSkip(Q)||isAnswered(Q);});
 app.innerHTML=`
  <div class="card">
    <div class="sec-label">${G.name}</div>
    ${parts}
    <div class="nav" style="margin-top:22px">
      <button class="btn ghost" onclick="prevGroup()" ${gIdx===0?'style="visibility:hidden"':''}>← Back</button>
      <span class="qcount">Card ${gIdx+1} of ${GROUPS.length}</span>
      <button class="btn" id="nextBtn" onclick="nextGroup()" ${answered?"":"disabled"}>${gIdx===GROUPS.length-1?"See my results →":"Next →"}</button>
    </div>
  </div>`;
 G.qs.forEach(qid=>{const Q=QUESTIONS.find(x=>x.id===qid);if(Q.type==="rank" && !shouldSkip(Q)) wireRank(Q);});
 saveState();
}
function shouldSkip(Q){ return false; }

function isAnswered(Q){
 const v=A[Q.id];
 if(Q.type==="multi") return Array.isArray(v)&&v.length>0;
 if(Q.type==="cards" && Q.multi) return Array.isArray(v)&&v.length>0;
 if(Q.type==="rank"||Q.type==="slider") return true; // defaults filled
 return v!==undefined&&v!==null;
}
function refreshNext(){const G=GROUPS[gIdx];const ok=G.qs.every(qid=>{const Q=QUESTIONS.find(x=>x.id===qid);return shouldSkip(Q)||isAnswered(Q);});const b=document.getElementById('nextBtn');if(b)b.disabled=!ok;saveState();}

/* --- single --- */
function renderSingle(Q){
 return `<div class="opts">`+Q.opts.map((o,i)=>{
   const sel=A[Q.id]===i?'sel':'';
   return `<div class="opt ${sel}" onclick="pickSingle('${Q.id}',${i})"><span class="mark"></span><span>${o[0]}${o[1]?`<span class="sub">${o[1]}</span>`:""}</span></div>`;
 }).join("")+`</div>`;
}
function pickSingle(id,i){A[id]=i;renderGroup();}

/* --- multi --- */
function renderMulti(Q){
 const sel=A[Q.id]||[];
 return `<div class="opts">`+Q.opts.map((o,i)=>{
   const on=sel.includes(i)?'sel':'';
   return `<div class="opt multi ${on}" onclick="pickMulti('${Q.id}',${i})"><span class="mark"></span><span>${o[0]}</span></div>`;
 }).join("")+`</div>`;
}
function pickMulti(id,i){
 const Q=QUESTIONS.find(x=>x.id===id);
 let sel=A[id]||[];
 if(sel.includes(i)) sel=sel.filter(x=>x!==i);
 else{ if(Q.max&&sel.length>=Q.max){return;} sel=[...sel,i]; }
 A[id]=sel; renderGroup();
}

/* --- cards --- */
function renderCards(Q){
 const multi=!!Q.multi;
 const sel = multi ? (A[Q.id]||[]) : [];
 return `<div class="scen">`+Q.opts.map((o,i)=>{
  const on = multi ? sel.includes(i) : A[Q.id]===i;
  const handler = multi ? `pickMulti('${Q.id}',${i})` : `pickSingle('${Q.id}',${i})`;
  return `<div class="opt ${on?'sel':''}" onclick="${handler}"><span class="tag">${o.tag}</span><span>${o.t}</span></div>`;
 }).join("")+`</div>`;
}

/* --- slider --- */
function renderSlider(Q){
 if(A[Q.id]===undefined) A[Q.id]=Math.floor(Q.scale.length/2);
 const v=A[Q.id];
 return `<div class="slider-wrap">
   <div class="slider-val" id="sv_${Q.id}">${Q.scale[v]}</div>
   <input type="range" min="0" max="${Q.scale.length-1}" value="${v}" oninput="setSlider('${Q.id}',this.value)">
   <div class="slider-labels"><span>${Q.scale[0]}</span><span>${Q.scale[Q.scale.length-1]}</span></div>
 </div>`;
}
function setSlider(id,val){A[id]=+val;const Q=QUESTIONS.find(x=>x.id===id);document.getElementById('sv_'+id).textContent=Q.scale[val];refreshNext();}

/* --- rank (drag & drop) --- */
function renderRank(Q){
 if(!A[Q.id]) A[Q.id]=[...Q.opts];
 return `<div class="rank-list" id="rank_${Q.id}">`+A[Q.id].map((o,i)=>
   `<div class="rank-item" draggable="true" data-val="${o}"><span class="num">${i+1}</span><span>${o}</span><span class="grip">⣿</span></div>`
 ).join("")+`</div>`;
}
function wireRank(Q){
 const list=document.getElementById('rank_'+Q.id);
 let dragEl=null;
 list.querySelectorAll('.rank-item').forEach(it=>{
  it.addEventListener('dragstart',()=>{dragEl=it;it.classList.add('dragging');});
  it.addEventListener('dragend',()=>{it.classList.remove('dragging');saveRank(Q);});
 });
 list.addEventListener('dragover',e=>{
  e.preventDefault();
  const after=getAfter(list,e.clientY);
  if(after==null) list.appendChild(dragEl); else list.insertBefore(dragEl,after);
 });
}
function getAfter(list,y){
 const els=[...list.querySelectorAll('.rank-item:not(.dragging)')];
 return els.reduce((closest,child)=>{
  const box=child.getBoundingClientRect();
  const offset=y-box.top-box.height/2;
  if(offset<0&&offset>closest.offset) return {offset,element:child};
  return closest;
 },{offset:-Infinity}).element||null;
}
function saveRank(Q){
 const list=document.getElementById('rank_'+Q.id);
 A[Q.id]=[...list.querySelectorAll('.rank-item')].map(x=>x.dataset.val);
 list.querySelectorAll('.rank-item .num').forEach((n,i)=>n.textContent=i+1);
}

/* --- true/false --- */
function renderTF(Q){
 return `<div class="tf">
   <div class="opt ${A[Q.id]===true?'sel':''}" onclick="pickSingle('${Q.id}',true)"><span class="mark"></span><span>Yes / True</span></div>
   <div class="opt ${A[Q.id]===false?'sel':''}" onclick="pickSingle('${Q.id}',false)"><span class="mark"></span><span>No / False</span></div>
 </div>`;
}

function nextGroup(){ saveState(); if(gIdx<GROUPS.length-1){gIdx++;renderGroup();} else { clearState(); computeAndShow(); } }
function prevGroup(){ if(gIdx>0){gIdx--;renderGroup();} }

/* ============================================================
   Scoring & routing engine
   ============================================================ */
function optLabel(qid){const Q=QUESTIONS.find(x=>x.id===qid);const v=A[qid];if(Q.type==="single"||Q.type==="cards"){return Q.type==="cards"?Q.opts[v].tag:Q.opts[v][0];}return v;}

function compute(){
 // ---- Journey routing ----
 let JA=0,JB=0;
 const r04=QUESTIONS.find(x=>x.id==="Q0.4").route[A["Q0.4"]]||{};JA+=r04.A||0;JB+=r04.B||0;
 const Q11=QUESTIONS.find(x=>x.id==="Q1.1");
 (A["Q1.1"]||[]).forEach(i=>{ const j=Q11.opts[i].j; JA+=j.A||0; JB+=j.B||0; });
 const Q06=QUESTIONS.find(x=>x.id==="Q0.6");
 const top=A["Q0.6"][0];
 const oj=Q06.objJourney[top];if(oj==="A")JA++;if(oj==="B")JB++;

 const hybrid=Math.abs(JA-JB)<=1;
 const primary=JA>=JB?"A":"B";
 const secondary=primary==="A"?"B":"A";

 // ---- Maturity per dimension ----
 const dimScores={};
 const dimAcc={};
 function add(dim,val){ if(!dimAcc[dim])dimAcc[dim]=[]; dimAcc[dim].push(val); }

 QUESTIONS.forEach(Q=>{
  if(!Q.dim) return;
  const v=A[Q.id];
  if(Q.maturity && Q.type==="single") add(Q.dim,v+1);
  else if(Q.maturity && Q.type==="slider") add(Q.dim,v+1);
  else if(Q.maturityCount){ const n=(v||[]).length; add(Q.dim, Math.max(1,Math.round(n/Q.opts.length*5))); }
  else if(Q.maturityTF){ add(Q.dim, v===true?4:2); }
  else if(Q.dcMaturity){ add(Q.dim, Q.dcMaturity[v]); }
  else if(Q.goldenMap){ add(Q.dim, Q.goldenMap[v]); }
 });
 Object.keys(DIM_NAMES).forEach(d=>{
  dimScores[d]= dimAcc[d]&&dimAcc[d].length ? dimAcc[d].reduce((a,b)=>a+b,0)/dimAcc[d].length : 3;
 });

 // weighting: top objective's dimension x1.5
 const topDim=Q06.objDim[top];
 let wsum=0,wtot=0;
 Object.keys(dimScores).forEach(d=>{const w=(d===topDim)?1.5:1;wsum+=dimScores[d]*w;wtot+=w;});
 const overall=wsum/wtot;
 const band=scoreBand(overall);

 // ---- Flags ----
 const Q03=QUESTIONS.find(x=>x.id==="Q0.3");
 const sov03=(A["Q0.3"]||[]).some(i=>Q03.opts[i][0]!==Q03.sovFlagExcept);
 const sov82=A["Q8.2"]===true;
 const sovFlag=sov03||sov82;
 const Q92=QUESTIONS.find(x=>x.id==="Q9.2");
 const aiFlag=(A["Q9.2"]||[]).some(i=>Q92.opts[i][0]!==Q92.aiFlagExcept);

 // ---- Value hook — anchor on actual spend when we have it ----
 const wasteRate=QUESTIONS.find(x=>x.id==="Q4.3").waste[A["Q4.3"]];
 const apps=QUESTIONS.find(x=>x.id==="Q0.5").apps[A["Q0.5"]];
 const Q08=QUESTIONS.find(x=>x.id==="Q0.8"); const Q09=QUESTIONS.find(x=>x.id==="Q0.9");
 const spendMidM = (Q08.midM[A["Q0.8"]]||0);
 const commitMid = (Q09.midPct[A["Q0.9"]]||0.1);
 const spendBased = spendMidM > 0;
 // commitments mitigate waste (they lock in price, not utilization) — halve the waste share sitting under a commitment
 const effWaste = wasteRate * (1 - commitMid*0.5);
 const leak = spendBased
   ? Math.round(spendMidM*1000000*effWaste)
   : Math.round(apps*42000*wasteRate);      // fallback: apps × directional per-app run-rate
 const leakLow=Math.round(leak*0.75), leakHigh=Math.round(leak*1.25);
 const hookBasis = spendBased
   ? { kind:"spend", spendM:spendMidM, commitPct:Math.round(commitMid*100), spendLabel:Q08.opts[A["Q0.8"]][0] }
   : { kind:"apps", apps:apps };

 // ---- Offering triggers ----
 const offers=[];
 const notStarted=A["Q0.4"]<=1;
 const heavyLegacy=A["Q3.2"]<=1;
 const goldenFalse=A["Q6.2"]===false;
 const dc=QUESTIONS.find(x=>x.id==="Q7.1");
 const dcExit=dc.dcExit[A["Q7.1"]];
 const poorInv=A["Q7.2"]<=1;
 const noOps=A["Q5.1"]<=1;

 if(dimScores.D3<=3 || wasteRate>=0.10) offers.push({code:"03.3",why:"Cost visibility / waste exposure"});
 if(dimScores.D4<=3 || noOps) offers.push({code:"03.2",why:"Inconsistent hybrid / multi-cloud ops"});
 if(dimScores.D5<=3 || goldenFalse) offers.push({code:"03.6",why:"Automation / platform gap"});
 if(dimScores.D1<=3 || notStarted) offers.push({code:"03.1",why:"Undefined target / placement"});
 if(dimScores.D2<=3 || heavyLegacy) offers.push({code:"03.4",why:"Legacy & modernization backlog"});
 if(dcExit || poorInv) offers.push({code:"03.5",why:"DC exit / weak estate discovery"});
 // D7 guardrails → 03.6 (in-pillar); dedicated security services referred to LTM Security (see referrals)
 if(dimScores.D7<=3) offers.push({code:"03.6",why:"Guardrails / landing-zone / policy-as-code gap"});
 // D8 AI ambition + weak data foundation → 03.6 (in-pillar readiness); AI program itself referred to Pillar 04
 if(aiFlag && dimScores.D8<=3) offers.push({code:"03.6",why:"Data / platform foundation for AI"});

 // dedupe by code, join reasons
 const merged={};
 offers.forEach(o=>{
   if(!merged[o.code]) merged[o.code]={code:o.code,whys:[o.why]};
   else if(!merged[o.code].whys.includes(o.why)) merged[o.code].whys.push(o.why);
 });
 const offersDedup=Object.values(merged).map(x=>({code:x.code,why:x.whys.join(" · ")}));

 // ---- Cross-practice / cross-pillar referrals ----
 const secReferral = dimScores.D7<=3; // dedicated security SERVICES → LTM Security practice

 // ---- Next-accelerator suggestions (funnel) ----
 const nextAcc=[];
 if(dimScores.D3<=3 || wasteRate>=0.20) nextAcc.push({label:"FinOps Value Case, then FinOps IQ",why:"cost visibility & waste"});
 if(primary==="B" && (dimScores.D6<=3 || dcExit || poorInv)) nextAcc.push({label:"Modernization IQ",why:"data-centre estate & modernization"});
 if(sovFlag) nextAcc.push({label:"Sovereign IQ (Pillar 02)",why:"residency / regulatory exposure"});

 // ---- 3-move roadmap: two lowest dims + top objective dim ----
 const sorted=Object.keys(dimScores).sort((a,b)=>dimScores[a]-dimScores[b]);
 const moveDims=[...new Set([sorted[0],sorted[1],topDim])].slice(0,3);
 // D7/D8 moves point to the in-pillar item (03.6). Cross-pillar/cross-practice referrals
 // (Sovereign IQ, AI Infusion, LTM Security) fire through the flag-driven handoff cards.
 const dimOffer={D1:"03.1",D2:"03.4",D3:"03.3",D4:"03.2",D5:"03.6",D6:"03.5",D7:"03.6",D8:"03.6"};
 const moves=moveDims.map((d,i)=>({
   n:i+1, dim:d, name:DIM_NAMES[d], score:dimScores[d].toFixed(1),
   offer:dimOffer[d], sep:false,
   note:(d==="D7"?"guardrails only — dedicated security services referred to LTM Security practice":
        d==="D8"?"data / platform foundation only — the AI program itself is Pillar 04 (AI Infusion)":null)
 }));

 // provider mix (labels)
 const Q07=QUESTIONS.find(x=>x.id==="Q0.7");
 const providers=(A["Q0.7"]||[]).map(i=>Q07.opts[i][0]);
 return {JA,JB,hybrid,primary,secondary,dimScores,overall,band,sovFlag,aiFlag,
   leakLow,leakHigh,wasteRate,apps,offers:offersDedup,moves,topDim,secReferral,nextAcc,hookBasis,providers};
}

function scoreBand(s){
 if(s<2)return "Nascent";if(s<3)return "Emerging";if(s<4)return "Established";if(s<4.5)return "Advanced";return "Leading";
}
const BANDS=["Nascent","Emerging","Established","Advanced","Leading"];
const JOURNEY_META={
 A:{name:"Optimize",stages:["Diagnose","Optimize","Govern","Run"],pop:"already on cloud / mid-migration"},
 B:{name:"Decide & Modernize",stages:["Diagnose","Decide","Modern","Build"],pop:"not started / tentative / hybrid"}
};
function fmt(n){return "$"+n.toLocaleString();}

/* ============================================================
   Results screen
   ============================================================ */
let RESULT=null;
function computeAndShow(){ RESULT=compute(); showResults(RESULT); }

function showResults(R){
 pfill.style.width="100%";
 const persona=QUESTIONS.find(x=>x.id==="Q0.1").opts[A["Q0.1"]][0];
 const industry=QUESTIONS.find(x=>x.id==="Q0.2").opts[A["Q0.2"]][0];
 const pM=JOURNEY_META[R.primary], sM=JOURNEY_META[R.secondary];

 // dimension bars
 const dimBars=Object.keys(DIM_NAMES).map(d=>{
  const v=R.dimScores[d];
  return `<div class="dimrow"><div class="dname">${d} · ${DIM_NAMES[d]}</div>

    <div class="dval">${v.toFixed(1)}</div></div>`;

 const bandScale=BANDS.map(b=>`<div class="band-seg ${b===R.band?'on':''}">${b}</div>`).join("");

 const moves=R.moves.map(m=>{

     ? `Points to <b>${m.offer}</b>${m.note?` — ${m.note}`:` (separate offering)`}`
     : `Offering <b>${m.offer} ${OFFERINGS[m.offer].name}</b>${m.note?` <span style="color:var(--mut)">— ${m.note}</span>`:""}`;
   return `<div class="move"><div class="mtitle">Move ${m.n}: Lift ${m.name} (now ${m.score}/5)</div>
   <div class="mmeta">→ ${dest}</div></div>`;
 }).join("");

 const offers=R.offers.map(o=>{const O=OFFERINGS[o.code];
   const spans=O.journey==="A/B shared"?`<span style="display:inline-block;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.5px;margin-left:8px;vertical-align:middle">SPANS BOTH JOURNEYS</span>`:"";
   const xref=O.xref?`<div style="font-size:11px;color:var(--coral);font-weight:600;margin-top:2px">${O.xref}</div>`:"";
   return `<div class="offer"><div><span class="ocode">${o.code}</span> — ${O.name}${spans}</div>
   ${xref}
   <div style="font-size:12px;color:var(--mut);margin-top:4px">Journey ${O.journey} · ${o.why}</div>
   <div class="odoor">Two doors: ${O.door}  ·  or advisory / consulting</div></div>`;}).join("") || `<div style="color:var(--mut)">No gaps triggered — you're in strong shape. A governance & optimization review still adds value.</div>`;

 let handoffs="";
 if(R.sovFlag) handoffs+=`<div class="handoff">🔐 <b>Digital Sovereignty (Pillar 02)</b> — residency / regulatory exposure detected. Start with <b>Sovereign IQ</b>; deep-dive on posture with <b>Posture IQ</b>.</div>`;
 if(R.aiFlag) handoffs+=`<div class="handoff">🤖 <b>AI Infusion (Pillar 04)</b> — data & AI ambition detected. Cross-pillar referral; no Pillar-03 offering delivers the AI program. In-pillar foundation work stays with <b>03.6 Platform Engineering & Developer Experience</b>.</div>`;
 if(R.secReferral) handoffs+=`<div class="handoff">🛡 <b>LTM Security practice</b> — dedicated security services (SOC, threat, IAM program) belong to the LTM Security practice, not Pillar 03. Pillar 03 owns cloud <i>guardrails</i> only.</div>`;
 if(!handoffs) handoffs=`<div style="color:var(--mut)">No sovereignty, AI, or security-services referrals raised.</div>`;

 const nextAccBlock = R.nextAcc.length
   ? `<div class="card"><h3>Next in the accelerator funnel</h3>${R.nextAcc.map(n=>`<div class="handoff" style="border-style:solid">🧭 <b>${n.label}</b> <span style="color:var(--mut);font-size:12px">— ${n.why}</span></div>`).join("")}</div>`
   : "";

 app.innerHTML=`
  <div class="card">
    <div class="sec-label">Your Cloud IQ result</div>
    <h1 style="font-size:26px">${persona} · ${industry}</h1>
    <p class="lead" style="margin-bottom:6px">Here's where you are on the journey — and what to do next.</p>
  </div>

  <div class="res-grid">
    <div class="card">
      <h3>Journey placement</h3>
      <div class="chip-journey chip-primary">PRIMARY — Journey ${R.primary} · ${pM.name}</div>
      <div class="stage-flow">${pM.stages.map((s,i)=>`<span class="stage ${i===0?'cur':''}">${s}</span>`).join("")}</div>
      ${R.hybrid?`<div style="margin-top:14px"><div class="chip-journey chip-secondary">ALSO RELEVANT — Journey ${R.secondary} · ${sM.name}</div>
        <div class="stage-flow">${sM.stages.map(s=>`<span class="stage">${s}</span>`).join("")}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:8px">You scored close on both — Cloud IQ classifies you <b>HYBRID</b> and surfaces offerings from both columns.</div></div>`:``}
    </div>
    <div class="card">
      <h3>Maturity scorecard</h3>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span class="badge">Overall ${R.overall.toFixed(1)} / 5</span>
        <span style="font-weight:700;color:var(--ink)">${R.band}</span>
      </div>
      <div class="band-scale">${bandScale}</div>
      <canvas id="radar" height="220" style="margin-top:14px"></canvas>
    </div>
  </div>

  <div class="card">
    <h3>Dimension detail (D1–D8)</h3>
    ${dimBars}
  </div>

  <div class="res-grid">
    <div class="card">
      <h3>Prioritized 3-move roadmap</h3>
      ${moves}
    </div>
    <div class="card">
      <h3>Quantified value hook</h3>
      <div class="valuehook">
        <div class="lbl">Estimated annual cost leakage</div>
        <div class="big">${fmt(R.leakLow)}–${fmt(R.leakHigh)}</div>
        <div style="font-size:12px;color:var(--mutd);margin-top:6px">${R.hookBasis.kind==="spend" ? `Anchored on your <b>${R.hookBasis.spendLabel}</b> annual spend &middot; ~${Math.round(R.wasteRate*100)}% waste &middot; ~${R.hookBasis.commitPct}% commitment coverage` : `Fallback estimate: ~${Math.round(R.wasteRate*100)}% waste across ~${R.hookBasis.apps} apps &middot; provide actual spend for a tighter number`}</div>
      </div>
      <div style="font-size:11px;color:var(--mut);margin-top:10px">Directional estimate for prioritization only — a FinOps Value Case + FinOps IQ deep-dive confirm the true number.</div>
    </div>
  </div>

  <div class="card">
    <h3>Recommended offerings (Pillar 03)</h3>
    ${offers}
  </div>

  <div class="card">
    <h3>Cross-pillar &amp; cross-practice referrals</h3>
    ${handoffs}
  </div>

  ${nextAccBlock}

  <div class="card" style="text-align:center;background:var(--panel2)">
    <h2 style="margin-bottom:6px">Take your report with you</h2>
    <p style="color:#4a3d33;margin-bottom:16px">Download the full LTM-branded Accelerate output pack as a PDF to share with your team.</p>
    <button class="btn big" onclick="downloadPDF()">📄 Download LTM PDF report</button>
    <div style="margin-top:12px"><button class="btn ghost" onclick="start()">Restart assessment</button></div>
    <p style="font-size:11px;color:var(--mut);margin-top:18px;line-height:1.5">
      This is a preliminary, indicative self-assessment intended for planning conversations only —
      not legal, tax, financial, or regulatory advice.
      All answers stay in your browser; nothing is transmitted to LTM unless you use Contact Us.
    </p>
  </div>`;

 drawRadar(R);
}

let radarChart=null;
function drawRadar(R){
 const ctx=document.getElementById('radar');
 const labels=Object.keys(DIM_NAMES);
 const data=labels.map(d=>R.dimScores[d]);
 if(radarChart) radarChart.destroy();
 radarChart=new Chart(ctx,{
  type:'radar',
  data:{labels,datasets:[{label:'Your maturity',data,
    backgroundColor:'rgba(255,94,79,0.20)',borderColor:'#FF5E4F',
    pointBackgroundColor:'#282828',borderWidth:2}]},
  options:{responsive:true,animation:{duration:600},
    scales:{r:{min:0,max:5,ticks:{stepSize:1,color:'#8E8E8E'},
      grid:{color:'#DADADA'},angleLines:{color:'#DADADA'},
      pointLabels:{color:'#282828',font:{size:11,weight:'600'}}}},
    plugins:{legend:{display:false}}}
 });
}

/* ============================================================
   LTM-standard PDF export
   ============================================================ */
function downloadPDF(){
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({unit:"pt",format:"a4"});
 const W=doc.internal.pageSize.getWidth();
 const H=doc.internal.pageSize.getHeight();
 const R=RESULT;
 const M=48;
 const rust=[255,94,79], dark=[40,40,40], green=[53,117,77], cream=[245,245,245], ink=[40,40,40], muted=[142,142,142], panelLine=[218,218,218];

 const persona=QUESTIONS.find(x=>x.id==="Q0.1").opts[A["Q0.1"]][0];
 const industry=QUESTIONS.find(x=>x.id==="Q0.2").opts[A["Q0.2"]][0];
 const pM=JOURNEY_META[R.primary], sM=JOURNEY_META[R.secondary];

 function footer(pageLabel){
  doc.setDrawColor(...cream);doc.setLineWidth(1);doc.line(M,H-40,W-M,H-40);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...muted);
  doc.text("LTM · Infrastructure Tech Advisory · Public Cloud & Modernization",M,H-26);
  doc.text(pageLabel,W-M,H-26,{align:"right"});
 }
 function headerBand(title){
  doc.setFillColor(...dark);doc.rect(0,0,W,64,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(255,255,255);
  doc.text("Cloud IQ",M,34);
  doc.setFont("helvetica","italic");doc.setFontSize(9);doc.setTextColor(200,200,200);
  doc.text("free self-assessment",M+90,34);
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(200,200,200);
  doc.text("INFRASTRUCTURE TECH ADVISORY",W-M,26,{align:"right"});
  doc.setFontSize(11);doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");
  doc.text(title,W-M,44,{align:"right"});
 }
 function sectionTitle(y,txt){
  doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(...rust);
  doc.text(txt.toUpperCase(),M,y);
  doc.setDrawColor(...rust);doc.setLineWidth(1.5);doc.line(M,y+5,M+28,y+5);
  return y+22;
 }

 /* ---------- PAGE 1 ---------- */
 headerBand("Accelerate — Output Pack");
 let y=96;
 doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...muted);
 doc.text('"where are you on the journey, and what hurts?"',M,y);
 doc.text("Prepared: "+new Date().toLocaleDateString(),W-M,y,{align:"right"});
 y+=22;

 // Lead profile box
 doc.setFillColor(...cream);doc.roundedRect(M,y,W-2*M,64,6,6,"F");
 doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...dark);
 doc.text("LEAD PROFILE",M+14,y+18);
 doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(...ink);
 const provLine = R.providers.length ? R.providers.join(", ") : "Not specified";
 const spendLine = R.hookBasis.kind==="spend" ? R.hookBasis.spendLabel : "not provided";
 doc.text(`Persona: ${persona}     Industry: ${industry}     Estate: ~${R.apps} apps`,M+14,y+34);
 doc.text(`Providers: ${provLine}     Annual cloud spend: ${spendLine}`,M+14,y+48);
 y+=84;

 // Journey placement
 y=sectionTitle(y,"1 · Journey placement");
 doc.setFillColor(...rust);doc.roundedRect(M,y,W-2*M,30,5,5,"F");
 doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(255,255,255);
 doc.text(`PRIMARY — Journey ${R.primary} · ${pM.name}   (${pM.stages.join("  →  ")})`,M+12,y+19);
 y+=38;
 if(R.hybrid){
  doc.setFillColor(...cream);doc.setDrawColor(...rust);doc.setLineWidth(1);
  doc.roundedRect(M,y,W-2*M,28,5,5,"FD");
  doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...dark);
  doc.text(`ALSO RELEVANT — Journey ${R.secondary} · ${sM.name}   (${sM.stages.join("  →  ")})`,M+12,y+18);
  y+=36;
  doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.setTextColor(...muted);
  doc.text("Classified HYBRID — offerings surface from both columns.",M+12,y);
  y+=16;
 } else { y+=4; }

 // Maturity scorecard with radar image
 y=sectionTitle(y+6,"2 · Maturity scorecard");
 doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(...dark);
 doc.text(`Overall  ${R.overall.toFixed(1)} / 5   —   ${R.band}`,M,y+4);
 // band scale
 let bx=M, by=y+14, bw=(W-2*M)/5;
 BANDS.forEach(b=>{
  const on=b===R.band;
  doc.setFillColor(...(on?rust:cream));doc.rect(bx,by,bw-3,16,"F");
  doc.setFontSize(7.5);doc.setTextColor(...(on?[255,255,255]:muted));doc.setFont("helvetica",on?"bold":"normal");
  doc.text(b,bx+(bw-3)/2,by+11,{align:"center"});
  bx+=bw;
 });
 y=by+28;
 // radar image
 try{
   const img=radarChart.toBase64Image("image/png",1);
   doc.addImage(img,"PNG",W/2-110,y,220,180);
 }catch(e){}
 y+=190;
 footer("Page 1 of 2");

 /* ---------- PAGE 2 ---------- */
 doc.addPage();
 headerBand("Accelerate — Output Pack");
 y=96;

 // Dimension table
 y=sectionTitle(y,"Dimension detail (D1–D8)");
 doc.autoTable({
  startY:y,
  head:[["Dim","Dimension","Score","Band"]],
  body:Object.keys(DIM_NAMES).map(d=>[d,DIM_NAMES[d],R.dimScores[d].toFixed(1),scoreBand(R.dimScores[d])]),
  theme:"grid",
  headStyles:{fillColor:rust,textColor:255,fontSize:9},
  bodyStyles:{fontSize:8.5,textColor:ink},
  alternateRowStyles:{fillColor:[245,245,245]},
  margin:{left:M,right:M},
  columnStyles:{0:{cellWidth:38,fontStyle:"bold"},2:{cellWidth:48,halign:"center"},3:{cellWidth:80}}
 });
 y=doc.lastAutoTable.finalY+22;

 // 3-move roadmap
 y=sectionTitle(y,"4 · Prioritized 3-move roadmap");
 R.moves.forEach(m=>{
  doc.setFillColor(251,241,233);doc.rect(M,y,W-2*M,30,"F");
  doc.setFillColor(...rust);doc.rect(M,y,4,30,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...dark);
  doc.text(`Move ${m.n}: Lift ${m.name} (now ${m.score}/5)`,M+12,y+13);
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...muted);
  const dest=m.sep?`Points to ${m.offer} (separate offering)`:`Offering ${m.offer} ${OFFERINGS[m.offer].name}`;
  doc.text("→ "+dest,M+12,y+24);
  y+=36;
 });
 y+=4;

 // Value hook
 y=sectionTitle(y,"5 · Quantified value hook");
 doc.setFillColor(...dark);doc.roundedRect(M,y,W-2*M,54,6,6,"F");
 doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(255,94,79);
 doc.text(`${fmt(R.leakLow)} – ${fmt(R.leakHigh)}`,W/2,y+26,{align:"center"});
 doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(200,200,200);
 const hookCaption = R.hookBasis.kind==="spend"
   ? `Anchored on your ${R.hookBasis.spendLabel} annual spend · ~${Math.round(R.wasteRate*100)}% waste · ~${R.hookBasis.commitPct}% commitment coverage`
   : `Fallback estimate: ~${Math.round(R.wasteRate*100)}% waste across ~${R.hookBasis.apps} apps · provide spend for a tighter number`;
 doc.text(hookCaption,W/2,y+42,{align:"center"});
 y+=68;

 // Offerings + referrals table
 y=sectionTitle(y,"6 · Recommended offerings (Pillar 03) & 7 · Referrals");
 const offerRows=R.offers.map(o=>{
   const O=OFFERINGS[o.code];
   const nm=O.name+(O.journey==="A/B shared"?"  [spans both journeys]":"")+(O.xref?"  ("+O.xref+")":"");
   return [o.code,nm,O.journey,O.door];
 });
 if(R.sovFlag)     offerRows.push(["→","Sovereign IQ / Posture IQ (Pillar 02 · Digital Sovereignty)","Cross-pillar","Referral"]);
 if(R.aiFlag)      offerRows.push(["→","AI Infusion (Pillar 04)","Cross-pillar","Referral"]);
 if(R.secReferral) offerRows.push(["→","LTM Security practice (SOC / threat / IAM)","Cross-practice","Referral"]);
 doc.autoTable({
  startY:y,
  head:[["Code","Offering","Journey","Onward course"]],
  body:offerRows.length?offerRows:[["—","No gaps triggered — optimization review recommended","—","—"]],
  theme:"grid",
  headStyles:{fillColor:green,textColor:255,fontSize:9},
  bodyStyles:{fontSize:8.5,textColor:ink},
  alternateRowStyles:{fillColor:[245,245,245]},
  margin:{left:M,right:M},
  columnStyles:{0:{cellWidth:42,fontStyle:"bold"},2:{cellWidth:70},3:{cellWidth:120}}
 });
 y=doc.lastAutoTable.finalY+12;
 if(R.nextAcc.length){
   doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(...dark);
   doc.text("Next in the accelerator funnel: "+R.nextAcc.map(n=>n.label).join("  ·  "),M,y,{maxWidth:W-2*M});
   y+=14;
 }
 doc.setFont("helvetica","italic");doc.setFontSize(8);doc.setTextColor(...muted);
 doc.text("Cloud IQ is the diagnostic layer — scores & flags feed FinOps IQ, Modernization IQ, Sovereign IQ / Posture IQ (Pillar 02) and AI Infusion (Pillar 04) downstream.",M,y,{maxWidth:W-2*M});
 y+=22;
 doc.setFont("helvetica","italic");doc.setFontSize(7.5);doc.setTextColor(...muted);
 doc.text("This is a preliminary, indicative self-assessment intended for planning conversations only — not legal, tax, financial, or regulatory advice. Answers stay in the user's browser; nothing is transmitted to LTM unless Contact Us is used.",M,y,{maxWidth:W-2*M});

 footer("Page 2 of 2");

 doc.save(`CloudIQ_Report_${industry.replace(/[^a-z]/gi,'')}_${new Date().toISOString().slice(0,10)}.pdf`);
}

/* boot */
start();
</script>
