<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sovereign Screen — Digital Sovereignty Screening · LTM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ground:#0A1826; --panel:#0F2438; --panel2:#12304A; --line:#22415C;
  --ink:#E8EFF6; --mut:#93A8BD; --mutd:#6E869C;
  --navy:#003865; --red:#F15F53; --amber:#FBAE40; --steel:#57B6C2; --lilac:#9B82D0; --blue:#58A6E0; --purple:#442671;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--ink); background:var(--ground); line-height:1.5; min-height:100vh;}
.gridbg{position:fixed; inset:0; pointer-events:none; opacity:.5; z-index:0;
  background-image:linear-gradient(rgba(87,182,194,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(87,182,194,.05) 1px,transparent 1px);
  background-size:48px 48px; mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 78%);}
.mono{font-family:'IBM Plex Mono',monospace;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--steel);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em; margin:0;}
.h1{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(28px,5vw,50px); line-height:1.05; letter-spacing:-.02em; margin:.15em 0;}
.h1.sm{font-size:clamp(24px,4vw,38px);}
.h2{font-size:22px; font-weight:600;}
.lead{color:var(--mut); font-size:17px; max-width:54ch;}
.blurb{color:var(--mut); font-size:14px; margin:2px 0 0;}
a{color:var(--steel);}

/* header */
.bar{position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:14px clamp(16px,4vw,40px); border-bottom:1px solid var(--line); background:rgba(10,24,38,.72); backdrop-filter:blur(6px);}
.brand{display:flex; align-items:center; gap:14px;}
.ltmlogo{display:flex; align-items:center; gap:9px; cursor:pointer;}
.ltmmark{width:30px; height:30px; border-radius:6px; background:conic-gradient(from 210deg,var(--red),var(--amber),var(--steel),var(--red)); box-shadow:inset 0 0 0 3px var(--ground); flex:none;}
.ltmlogo img{height:30px; max-width:150px; object-fit:contain;}
.ltmword{line-height:1.1;}
.ltmword b{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600;}
.ltmword span{display:block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.14em; color:var(--mutd); text-transform:uppercase;}
.ph-note{font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:.1em; color:var(--amber); border:1px solid var(--line); border-radius:4px; padding:1px 4px; margin-left:6px;}
.nav{display:flex; gap:6px; align-items:center;}
.navbtn{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.03em; color:var(--mut); background:none; border:1px solid transparent; padding:7px 13px; border-radius:8px; cursor:pointer;}
.navbtn:hover{color:var(--ink);}
.navbtn.on{background:var(--panel); color:var(--ink); border-color:var(--line);}
.tier{display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--panel);}
.tierbtn{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--mut); background:none; border:none; padding:6px 13px; border-radius:999px; cursor:pointer;}
.tierbtn.on{background:var(--navy); color:#fff;}

/* layout */
.wrap{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:30px clamp(16px,4vw,40px) 60px;}
.steps{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.stepchip{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--mutd); padding:6px 12px; border:1px solid var(--line); border-radius:999px;}
.stepchip .n{font-family:'IBM Plex Mono',monospace; font-size:11px;}
.stepchip.on{color:var(--ink); border-color:var(--steel);}
.stepchip.done{color:var(--steel);}

/* buttons */
.btn{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; padding:11px 18px; border-radius:10px; cursor:pointer; border:1px solid transparent; transition:transform .12s,background .12s,border-color .12s;}
.btn:hover{transform:translateY(-1px);}
.btn.primary{background:var(--red); color:#160404;}
.btn.primary:hover{background:#ff6f63;}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--steel);}
.btn.lg{font-size:16px; padding:14px 24px;}
.btn.sm{font-size:12.5px; padding:8px 13px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

/* forms */
.field{margin-bottom:18px;}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:7px;}
.field .sub{font-weight:400; color:var(--mutd); font-size:12px;}
.input,.textarea,select{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:inherit; font-size:14.5px;}
.input:focus,.textarea:focus,select:focus{outline:none; border-color:var(--steel);}
.textarea{min-height:88px; resize:vertical;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.logoup{display:flex; align-items:center; gap:16px;}
.logobox{width:96px; height:96px; border:1px dashed var(--line); border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; background:var(--panel); overflow:hidden; flex:none;}
.logobox img{max-width:100%; max-height:100%; object-fit:contain;}
.logobox span{font-size:11px; color:var(--mutd); padding:6px;}

/* intro signature */
.signature{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin:30px 0; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel);}
.signode{padding:20px 22px;}
.signode.alt{text-align:right; background:linear-gradient(90deg,transparent,rgba(241,95,83,.08));}
.sigk{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mutd);}
.sigv{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; margin-top:4px;}
.sigbridge{min-height:64px; width:160px; display:flex; align-items:center; justify-content:center; border-left:1px dashed var(--line); border-right:1px dashed var(--line);}
.sigbridge span{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--amber); text-align:center; padding:0 8px;}
.sigbridge.hot span{color:var(--red);}

/* questionnaire shell */
.shell{display:grid; grid-template-columns:230px 1fr; gap:0; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:rgba(15,36,56,.4);}
.rail{border-right:1px solid var(--line); padding:22px 12px; display:flex; flex-direction:column; gap:3px;}
.railitem{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; border:none; background:none; color:var(--mut); cursor:pointer; text-align:left; font-size:13.5px; width:100%;}
.railitem:hover{background:var(--panel);}
.railitem.active{background:var(--panel); color:var(--ink);}
.railitem.active .railn{color:var(--red);}
.railn{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--mutd);}
.raill{flex:1;}
.railck{color:var(--steel); font-size:12px;}
.main{padding:24px clamp(16px,3vw,32px) 30px;}
.progress{height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:24px;}
.progressfill{height:100%; background:linear-gradient(90deg,var(--steel),var(--amber)); transition:width .3s;}
.sechead{display:flex; gap:14px; align-items:flex-start; margin-bottom:22px;}
.secn{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--red); border:1px solid var(--line); border-radius:8px; padding:6px 9px;}
.qs{display:flex; flex-direction:column; gap:24px;}
.q{border-top:1px solid var(--line); padding-top:20px;}
.q:first-child{border-top:none; padding-top:0;}
.qtext{font-size:16px; font-weight:500; margin-bottom:4px;}
.qhint{color:var(--amber); font-size:12.5px; margin-bottom:10px; font-family:'IBM Plex Mono',monospace;}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.opt{display:flex; align-items:center; gap:11px; text-align:left; padding:12px 15px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font-size:14.5px;}
.opt:hover{border-color:var(--steel);}
.opt.sel{border-color:var(--red); background:rgba(241,95,83,.08);}
.optdot{width:13px; height:13px; border-radius:50%; border:2px solid var(--mutd); flex:none;}
.opt.sel .optdot{border-color:var(--red); background:var(--red); box-shadow:inset 0 0 0 2px var(--panel);}
.optbox{width:18px; height:18px; border-radius:5px; border:2px solid var(--mutd); flex:none; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ground);}
.opt.sel .optbox{border-color:var(--red); background:var(--red);}
.opt.na{border-style:dashed; color:var(--mut);}
.bool{display:flex; gap:8px; margin-top:12px;}
.boolbtn{flex:1; padding:13px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:600; cursor:pointer;}
.boolbtn:hover{border-color:var(--steel);}
.boolbtn.on{border-color:var(--red); background:rgba(241,95,83,.1);}
.rating{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px;}
.ratebtn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--mut); cursor:pointer;}
.ratebtn:hover{border-color:var(--steel);}
.ratebtn.on{border-color:var(--amber); background:rgba(251,174,64,.1); color:var(--ink);}
.raten{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600;}
.ratel{font-size:10.5px;}
.rangewrap{display:flex; align-items:center; gap:16px; margin-top:12px;}
.range{flex:1; accent-color:var(--red);}
.rangeval{font-size:14px; min-width:130px;}
.drag{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
.dragitem{display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel);}
.dragrank{color:var(--red); font-size:14px;}
.draglabel{flex:1; font-size:14.5px;}
.dragctl{display:flex; gap:4px;}
.dragctl button{width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--ground); color:var(--mut); cursor:pointer; font-size:10px;}
.dragctl button:disabled{opacity:.3; cursor:not-allowed;}
.navrow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--line);}
.navmeta{font-size:12px; color:var(--mutd);}

/* question bank */
.bankgrid{display:flex; flex-direction:column; gap:18px;}
.panelcard{border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:20px;}
.stat{display:flex; gap:26px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--mut);}
.stat b{color:var(--ink); font-size:20px; font-family:'Space Grotesk',sans-serif;}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
table.qtable{width:100%; border-collapse:collapse; font-size:13px;}
table.qtable th,table.qtable td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
table.qtable th{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--mutd);}
.pill{font-family:'IBM Plex Mono',monospace; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--mut);}
.jsoned{width:100%; min-height:300px; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.5; padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--ground); color:var(--ink); resize:vertical; white-space:pre;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--steel); color:var(--ink); padding:11px 18px; border-radius:10px; font-size:13.5px; z-index:50; box-shadow:0 8px 30px rgba(0,0,0,.4);}

/* ===== REPORT (light, printable document) ===== */
.reportwrap{position:relative; z-index:1; padding:24px clamp(12px,3vw,32px) 60px;}
.reportbar{display:flex; gap:10px; justify-content:flex-end; margin-bottom:16px; flex-wrap:wrap;}
.paper{background:#fff; color:#16202B; border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.4); max-width:820px; margin:0 auto;
  font-family:'IBM Plex Sans',sans-serif;}
.paper .cover{padding:38px 44px 30px; border-bottom:3px solid var(--navy); background:linear-gradient(180deg,#F5F8FB,#fff);}
.covertop{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:26px;}
.coverlogo{display:flex; align-items:center; gap:9px;}
.coverlogo .ltmmark{box-shadow:inset 0 0 0 3px #F5F8FB;}
.coverlogo b{font-family:'Space Grotesk',sans-serif; font-size:15px; color:#0A1826;}
.coverlogo span{display:block; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.14em; color:#7089A0; text-transform:uppercase;}
.coverlogo img{height:34px; max-width:170px; object-fit:contain;}
.reptitle{font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:600; color:#0A1826; line-height:1.1;}
.repsub{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); margin-top:8px;}
.covermeta{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:26px;}
.metablock .mlab{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#7089A0; margin-bottom:6px;}
.metablock .mval{font-size:15px; font-weight:600; color:#16202B;}
.metablock .mline{font-size:13px; color:#48586A;}
.orgident{display:flex; align-items:center; gap:12px;}
.orgident img{height:40px; max-width:120px; object-fit:contain; border-radius:4px;}
.paper .body{padding:32px 44px 40px;}
.repsec{margin-bottom:30px;}
.repsec h3{font-family:'Space Grotesk',sans-serif; font-size:16px; color:#0A1826; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid #E3EAF1; letter-spacing:.01em;}
.rephero{display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
.repscore{width:110px; height:110px; border-radius:50%; border:2px solid var(--navy); display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; background:#F5F8FB;}
.repscore b{font-family:'Space Grotesk',sans-serif; font-size:34px; color:var(--navy);}
.repscore span{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#7089A0;}
.repstage b{font-family:'Space Grotesk',sans-serif; font-size:24px; color:#0A1826;}
.repstage p{color:#48586A; font-size:14px; margin:6px 0 0; max-width:48ch;}
.rgauge{margin:20px 0 6px;}
.rgtrack{position:relative; height:12px; border-radius:6px; background:#EAF0F6; border:1px solid #D4DEE8; overflow:hidden;}
.rgfill{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--red),var(--amber),var(--steel));}
.rgtick{position:absolute; top:-1px; bottom:-1px; width:1px; background:#fff;}
.rglabels{display:grid; grid-template-columns:repeat(5,1fr); margin-top:9px;}
.rgst{font-size:11px; color:#7089A0;}
.rgst.on{color:#0A1826; font-weight:600;}
.rgst .n{font-family:'IBM Plex Mono',monospace; font-size:10px; display:block; color:#9AA;}
.rgst.on .n{color:var(--red);}
.repstat{display:flex; gap:26px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:13px; color:#48586A; margin-top:14px;}
.repstat b{color:#0A1826;}
.rsig{border:1px solid #E3EAF1; border-radius:10px; overflow:hidden; margin-top:6px;}
.rsighead{display:flex; justify-content:space-between; padding:12px 16px; background:#F5F8FB; border-bottom:1px solid #E3EAF1;}
.rsighead .k{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--red);}
.rsighead .s{font-size:12px; color:#7089A0;}
.rsigdia{display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch;}
.rsignode{padding:16px 18px;}
.rsignode.alt{text-align:right; background:#FDF2F1;}
.rsignode .k{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#7089A0;}
.rsignode .v{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600; color:#0A1826; margin-top:3px;}
.rsigbridge{width:150px; display:flex; align-items:center; justify-content:center; border-left:1px dashed #D4DEE8; border-right:1px dashed #D4DEE8; padding:0 8px;}
.rsigbridge span{font-family:'IBM Plex Mono',monospace; font-size:10px; text-align:center; color:var(--red);}
.rsigcopy{padding:14px 16px; color:#48586A; font-size:13px; border-top:1px solid #E3EAF1;}
.rreg{border:1px solid #E3EAF1; border-radius:10px; padding:16px 18px; margin-bottom:10px;}
.rreghead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
.rregname{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px; color:#0A1826;}
.rregshort{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7089A0; margin-top:2px;}
.rtag{font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:4px 10px; border-radius:999px; border:1px solid; white-space:nowrap; flex:none;}
.rwhy{color:#48586A; font-size:13px; margin:10px 0;}
.rreadbar{display:flex; align-items:center; gap:12px; margin:10px 0;}
.rreadtrack{flex:1; height:7px; border-radius:4px; background:#EAF0F6; overflow:hidden;}
.rreadfill{height:100%;}
.rreadval{font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7089A0; min-width:120px; text-align:right;}
.roblabel{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#7089A0; margin:12px 0 6px;}
.robl{margin:0; padding-left:18px; color:#16202B; font-size:13px;}
.robl li{margin:4px 0;}
.repfoot{padding:20px 44px 30px; border-top:1px solid #E3EAF1; color:#7089A0; font-size:11.5px;}
.repfoot .disc{margin-top:8px;}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .rail{flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line);}
  .grid2,.covermeta{grid-template-columns:1fr;}
  .signature,.rsigdia{grid-template-columns:1fr;}
  .sigbridge,.rsigbridge{width:auto; border-left:none; border-right:none; border-top:1px dashed var(--line);}
  .signode.alt,.rsignode.alt{text-align:left;}
}
:focus-visible{outline:2px solid var(--steel); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

/* ===== PRINT ===== */
@media print{
  @page{margin:14mm;}
  body{background:#fff;}
  .gridbg,.bar,.reportbar,.no-print{display:none!important;}
  .reportwrap{padding:0;}
  .paper{box-shadow:none; border-radius:0; max-width:none; margin:0;}
  .repsec,.rreg,.rsig{page-break-inside:avoid;}
  .repsec h3{page-break-after:avoid;}
}
</style>
</head>
<body>
<div class="gridbg"></div>
<header class="bar no-print">
  <div class="brand">
    <div class="ltmlogo" id="ltmLogo" title="Set LTM logo (your property)">
      <span class="ltmmark" id="ltmMark"></span>
      <span class="ltmword"><b>LTM</b><span>Digital Sovereignty Screening</span></span>
      <span class="ph-note" id="ltmPh">LOGO · CLICK TO SET</span>
    </div>
  </div>
  <div class="nav" id="topnav">
    <button class="navbtn" data-nav="assessment">Assessment</button>
    <button class="navbtn" data-nav="bank">Question Bank</button>
    <div class="tier" id="tierToggle">
      <button class="tierbtn" data-tier="1">Indicative</button>
      <button class="tierbtn" data-tier="2">Extended</button>
    </div>
  </div>
</header>
<div id="app"></div>
<input type="file" id="fileLtm" accept="image/*" style="display:none"/>
<input type="file" id="fileOrg" accept="image/*" style="display:none"/>
<input type="file" id="fileImport" accept=".json,application/json" style="display:none"/>

<script>
/* =====================================================================
   DEFAULT KNOWLEDGE BASE (finance vertical, UK & EU) — delivered schema.
   Exportable/importable via the Question Bank tab.
   ===================================================================== */
const DEFAULT_KB = {
  meta:{
    schema_version:"0.1.0", vertical:"financial_services", phase:"Phase 1 (UK & EU)", last_reviewed:"2026-07-21",
    disclaimer:"Indicative triage / applicability screening. Not legal advice. Applicability depends on specific facts and should be confirmed with qualified counsel.",

const GRADE_COLORS = { applies:"#2E7DB8", likely_confirm:"#C98A12", partial:"#7A5AA8", needs_legal_review:"#D8452F", advisory:"#2E8B96", not_applicable:"#8494A4" };

/* ---------------- engine ---------------- */
function leaf(c,f){
  const v=f[c.fact], op=c.op, val=c.value;
  switch(op){
    case "is_true": return v===true;
    case "is_false": return v===false;
    case "eq": return v===val;
    case "neq": return v!==val;
    case "in": return Array.isArray(val)&&val.includes(v);
    case "not_in": return Array.isArray(val)&&!val.includes(v);
    case "includes_any": return Array.isArray(v)&&val.some(x=>v.includes(x));
    case "includes_all": return Array.isArray(v)&&val.every(x=>v.includes(x));
    case "gte": return v!=null&&v>=val;
    case "lte": return v!=null&&v<=val;
    default: return false;
  }
}
function evalCond(c,f){
  if(!c) return true;
  if(c.all) return c.all.every(x=>evalCond(x,f));
  if(c.any) return c.any.some(x=>evalCond(x,f));
  if(c.not) return !evalCond(c.not,f);
  return leaf(c,f);
}
function mergeFacts(f,fv){
  for(const k of Object.keys(fv||{})){
    const val=fv[k];
    if(Array.isArray(val)) f[k]=Array.from(new Set([...(f[k]||[]),...val]));
    else if(typeof val==="boolean") f[k]=(f[k]===true)||(val===true);
    else f[k]=val;
  }
}
function computeFacts(kb,answers){
  const f={};
  for(let pass=0;pass<2;pass++){
    for(const q of kb.questions){
      const a=answers[q.id];
      if(a===undefined||a==="__NA__") continue;
      if(q.shown_if && !evalCond(q.shown_if,f)) continue;
      if(q.answer_type==="boolean"){ if(q.writes&&q.writes[0]) f[q.writes[0]]=a; }
      else if(q.answer_type==="range"){ if(q.writes&&q.writes[0]) f[q.writes[0]]=a; }
      else if(q.answer_type==="single_select"){ const o=q.options[a]; if(o) mergeFacts(f,o.fact_value); }
      else if(q.answer_type==="multi_select"){ for(const i of a){ const o=q.options[i]; if(o) mergeFacts(f,o.fact_value);} }
    }
  }
  return f;
}
function assess(kb,facts){
  const prec=kb.meta.grade_precedence;
  const out=[];
  for(const r of kb.regimes){
    const fired=(r.applicability_rules||[]).filter(rl=>evalCond(rl.when,facts)).map(rl=>({grade:rl.grade,why:rl.rationale}));
    if(fired.length){
      fired.sort((a,b)=>prec.indexOf(a.grade)-prec.indexOf(b.grade));
      out.push({regime:r,grade:fired[0].grade,why:fired[0].why});
    }
  }
  out.sort((a,b)=>prec.indexOf(a.grade)-prec.indexOf(b.grade));
  return out;
}
function stageFor(kb,score){ for(const s of kb.meta.maturity_spine.stages){ if(score>=s.band[0]&&score<=s.band[1]) return s; } return kb.meta.maturity_spine.stages.slice(-1)[0]; }
function computeReadiness(kb,answers,facts,byRegime){
  const bucket={};
  for(const q of kb.questions){
    if(!q.readiness) continue;
    const a=answers[q.id];
    if(a===undefined||a==="__NA__") continue;
    if(q.shown_if && !evalCond(q.shown_if,facts)) continue;
    let score=null;
    if(q.answer_type==="rating_1_5") score=((a-1)/4)*100;
    else if(q.answer_type==="single_select"){ const o=q.options[a]; if(o&&typeof o.score==="number") score=o.score; }
    if(score===null) continue;
    const {regime,dimension}=q.readiness;
    bucket[regime]=bucket[regime]||{};
    (bucket[regime][dimension]=bucket[regime][dimension]||[]).push(score);
  }
  const regimeScores={};
  for(const r of kb.regimes){
    const res=byRegime[r.id];
    if(!res||!["applies","likely_confirm","partial"].includes(res.grade)) continue;
    const b=bucket[r.id]; if(!b) continue;
    let wsum=0,acc=0;
    for(const d of r.readiness_dimensions){ const arr=b[d.id]; if(arr&&arr.length){ acc+=(arr.reduce((x,y)=>x+y,0)/arr.length)*d.weight; wsum+=d.weight; } }
    if(wsum>0) regimeScores[r.id]=Math.round(acc/wsum);
  }
  let owsum=0,oacc=0;
  for(const r of kb.regimes){ if(regimeScores[r.id]!=null){ oacc+=regimeScores[r.id]*r.weight; owsum+=r.weight; } }
  return { regimeScores, overall: owsum>0?Math.round(oacc/owsum):null };
}

function renderQuestion(q){
  const a=S.answers[q.id];
  let body="";
  if(q.answer_type==="single_select"){
    body='<div class="opts">'+q.options.map((o,i)=>'<button class="opt'+(a===i?' sel':'')+'" data-action="ansSingle" data-q="'+q.id+'" data-i="'+i+'"><span class="optdot"></span>'+esc(o.label)+'</button>').join("")
      +(q.allow_not_applicable?'<button class="opt na'+(a==="__NA__"?' sel':'')+'" data-action="ansNA" data-q="'+q.id+'">Not applicable</button>':'')+'</div>';
  } else if(q.answer_type==="multi_select"){
    const arr=Array.isArray(a)?a:[];
    body='<div class="opts">'+q.options.map((o,i)=>'<button class="opt'+(arr.includes(i)?' sel':'')+'" data-action="ansMulti" data-q="'+q.id+'" data-i="'+i+'"><span class="optbox">'+(arr.includes(i)?'✓':'')+'</span>'+esc(o.label)+'</button>').join("")
      +(q.allow_not_applicable?'<button class="opt na'+(a==="__NA__"?' sel':'')+'" data-action="ansNA" data-q="'+q.id+'">Not applicable</button>':'')+'</div>';
  } else if(q.answer_type==="boolean"){
    body='<div class="bool"><button class="boolbtn'+(a===true?' on':'')+'" data-action="ansBool" data-q="'+q.id+'" data-v="true">Yes</button><button class="boolbtn'+(a===false?' on':'')+'" data-action="ansBool" data-q="'+q.id+'" data-v="false">No</button></div>';
  } else if(q.answer_type==="rating_1_5"){
    const labels=["Nascent","Emerging","Developing","Strong","Leading"];
    body='<div class="rating">'+[1,2,3,4,5].map(n=>'<button class="ratebtn'+(a===n?' on':'')+'" data-action="ansRate" data-q="'+q.id+'" data-v="'+n+'"><span class="raten">'+n+'</span><span class="ratel">'+labels[n-1]+'</span></button>').join("")+'</div>';
  } else if(q.answer_type==="range"){
    const {min,max,step,suffix}=q.range; const v=(a===undefined?min:a);
    body='<div class="rangewrap"><input class="range" type="range" min="'+min+'" max="'+max+'" step="'+(step||1)+'" value="'+v+'" data-action="ansRange" data-q="'+q.id+'"/><div class="rangeval mono" id="rv_'+q.id+'">'+v+(suffix||"")+'</div></div>';
  } else if(q.answer_type==="drag_order"){
    const order=Array.isArray(a)?a:q.options.slice();
    body='<ol class="drag">'+order.map((it,i)=>'<li class="dragitem"><span class="dragrank mono">'+(i+1)+'</span><span class="draglabel">'+esc(it)+'</span><span class="dragctl"><button data-action="dragUp" data-q="'+q.id+'" data-i="'+i+'" '+(i===0?'disabled':'')+'>▲</button><button data-action="dragDown" data-q="'+q.id+'" data-i="'+i+'" '+(i===order.length-1?'disabled':'')+'>▼</button></span></li>').join("")+'</ol>';
  } else if(q.answer_type==="open_text"){
    body='<textarea class="textarea" data-action="ansText" data-q="'+q.id+'" placeholder="'+esc(q.placeholder||"")+'">'+esc(a==="__NA__"?"":(a||""))+'</textarea>';
  }
  return '<div class="q"><div class="qtext">'+esc(q.text)+'</div>'+(q.hint?'<div class="qhint">'+esc(q.hint)+'</div>':'')+body+'</div>';
}

  if(a==="goto"){ S.tab="assessment"; S.screen=el.dataset.screen; render(); }
  else if(a==="orgNext"){ if(!S.org.name) return; S.screen="respondent"; render(); }
  else if(a==="respNext"){ if(!S.respondent.name) return; S.screen="assess"; S.step=0; render(); }
  else if(a==="assessBack"){ if(S.step===0){S.screen="respondent";} else {S.step--;} render(); }
  else if(a==="assessNext"){ S.step++; render(); }
  else if(a==="gotoStep"){ S.step=Number(el.dataset.i); render(); }
  else if(a==="goReport"){ S.screen="report"; render(); window.scrollTo(0,0); }
  else if(a==="printPdf"){ window.print(); }
  // answers
  else if(a==="ansSingle"){ const q=el.dataset.q,i=Number(el.dataset.i); S.answers[q]=(S.answers[q]===i?undefined:i); rerenderQs(); }
  else if(a==="ansMulti"){ const q=el.dataset.q,i=Number(el.dataset.i); const arr=Array.isArray(S.answers[q])?S.answers[q].slice():[]; const p=arr.indexOf(i); if(p>=0)arr.splice(p,1);else arr.push(i); S.answers[q]=arr.length?arr:undefined; rerenderQs(); }
  else if(a==="ansNA"){ const q=el.dataset.q; S.answers[q]=(S.answers[q]==="__NA__"?undefined:"__NA__"); rerenderQs(); }
  else if(a==="ansBool"){ const q=el.dataset.q,v=el.dataset.v==="true"; S.answers[q]=(S.answers[q]===v?undefined:v); rerenderQs(); }
  else if(a==="ansRate"){ const q=el.dataset.q,v=Number(el.dataset.v); S.answers[q]=(S.answers[q]===v?undefined:v); rerenderQs(); }
  else if(a==="dragUp"||a==="dragDown"){ const q=el.dataset.q,i=Number(el.dataset.i); const qq=S.kb.questions.find(x=>x.id===q); const order=Array.isArray(S.answers[q])?S.answers[q].slice():qq.options.slice(); const j=i+(a==="dragUp"?-1:1); if(j<0||j>=order.length)return; [order[i],order[j]]=[order[j],order[i]]; S.answers[q]=order; rerenderQs(); }
  // bank
  else if(a==="exportKb"){ download("digital-sovereignty-question-bank.json", JSON.stringify(S.kb,null,2)); toast("Question bank exported"); }
  else if(a==="importKb"){ $("#fileImport").click(); }
  else if(a==="resetKb"){ S.kb=deepClone(DEFAULT_KB); S.answers={}; render(); toast("Reset to default question bank"); }
  else if(a==="setLtm"){ $("#fileLtm").click(); }
  else if(a==="applyJson"){ applyJson(); }
  else if(a==="revertJson"){ render(); }
  // logos
  else if(a==="uploadOrg"){ $("#fileOrg").click(); }
  else if(a==="clearOrgLogo"){ S.org.logo=null; render(); }
});

$("#ltmLogo").addEventListener("click", ()=>$("#fileLtm").click());

// text/model inputs (no re-render to preserve focus)
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.model){ setModel(el.dataset.model, el.value);
    // enable Continue buttons live
    const nb=document.querySelector('[data-action="orgNext"]'); if(nb && el.dataset.model==="org.name") nb.disabled=!el.value;
    const rb=document.querySelector('[data-action="respNext"]'); if(rb && el.dataset.model==="respondent.name") rb.disabled=!el.value;
    return; }
  if(el.dataset.action==="ansText"){ const q=el.dataset.q; S.answers[q]=el.value||undefined; return; }
  if(el.dataset.action==="ansRange"){ const q=el.dataset.q; const v=Number(el.value); S.answers[q]=v; const lab=$("#rv_"+q); const qq=S.kb.questions.find(x=>x.id===q); if(lab) lab.textContent=v+((qq.range&&qq.range.suffix)||""); return; }
});

// file readers
$("#fileLtm").addEventListener("change", e=>readImage(e,"ltm"));
$("#fileOrg").addEventListener("change", e=>readImage(e,"org"));
$("#fileImport").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const parsed=JSON.parse(rd.result); if(validateKb(parsed)){ S.kb=parsed; S.answers={}; render(); toast("Question bank imported"); } }catch(err){ toast("Import failed — invalid JSON"); } e.target.value=""; };
  rd.readAsText(f);
});
function readImage(e,which){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ if(which==="ltm")S.ltmLogo=rd.result; else S.org.logo=rd.result; render(); if(which==="ltm")toast("LTM logo set"); }; rd.readAsDataURL(f); e.target.value=""; }

function rerenderQs(){ render(); }

function applyJson(){ try{ const parsed=JSON.parse($("#jsoned").value); if(validateKb(parsed)){ S.kb=parsed; S.answers={}; render(); toast("Changes applied"); } }catch(err){ toast("Invalid JSON — "+err.message); } }
function validateKb(k){ if(!k||!Array.isArray(k.questions)||!Array.isArray(k.regimes)||!k.meta||!k.meta.maturity_spine){ toast("Not a valid knowledge base (need meta, regimes, questions)"); return false; } if(!Array.isArray(k.sections)) k.sections=DEFAULT_KB.sections; return true; }

function download(name,text){ const b=new Blob([text],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }

render();
</script>
</body>
</html>
