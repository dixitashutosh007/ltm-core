<style>
:root{
  --ground:#0A1826; --panel:#0F2438; --panel2:#12304A; --line:#22415C;
  --ink:#E8EFF6; --mut:#93A8BD; --mutd:#6E869C;
  --navy:#003865; --red:#F15F53; --amber:#FBAE40; --steel:#57B6C2; --lilac:#9B82D0; --blue:#58A6E0; --green:#3FB98A;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--ground);line-height:1.5;min-height:100vh;}
.gridbg{position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
 background-image:linear-gradient(rgba(87,182,194,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(87,182,194,.05) 1px,transparent 1px);
 background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 78%);}
.mono{font-family:'IBM Plex Mono',monospace;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em;margin:0;}
.h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(28px,5vw,52px);line-height:1.04;letter-spacing:-.02em;margin:.15em 0;}
.h1.sm{font-size:clamp(24px,4vw,38px);}
.h2{font-size:22px;font-weight:600;}
.lead{color:var(--mut);font-size:17px;max-width:56ch;}
.blurb{color:var(--mut);font-size:14px;margin:2px 0 0;}

.bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
 padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:rgba(10,24,38,.72);backdrop-filter:blur(6px);}
.ltmlogo{display:flex;align-items:center;gap:9px;cursor:pointer;}
.ltmmark{width:30px;height:30px;border-radius:6px;background:conic-gradient(from 210deg,var(--red),var(--amber),var(--steel),var(--red));box-shadow:inset 0 0 0 3px var(--ground);flex:none;}
.ltmlogo img{height:30px;max-width:150px;object-fit:contain;}
.ltmword b{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;}
.ltmword span{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--mutd);text-transform:uppercase;}
.ph-note{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--amber);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;}
.nav{display:flex;gap:6px;align-items:center;}
.navbtn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mut);background:none;border:1px solid transparent;padding:7px 13px;border-radius:8px;cursor:pointer;}
.navbtn:hover{color:var(--ink);} .navbtn.on{background:var(--panel);color:var(--ink);border-color:var(--line);}

.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:30px clamp(16px,4vw,40px) 60px;}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.stepchip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mutd);padding:6px 12px;border:1px solid var(--line);border-radius:999px;}
.stepchip .n{font-family:'IBM Plex Mono',monospace;font-size:11px;}
.stepchip.on{color:var(--ink);border-color:var(--steel);} .stepchip.done{color:var(--steel);}

.btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:transform .12s,background .12s,border-color .12s;}
.btn:hover{transform:translateY(-1px);}
.btn.primary{background:var(--red);color:#160404;} .btn.primary:hover{background:#ff6f63;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);} .btn.ghost:hover{border-color:var(--steel);}
.btn.lg{font-size:16px;padding:14px 24px;} .btn.sm{font-size:12.5px;padding:8px 13px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.field{margin-bottom:18px;} .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.input,.textarea,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:14.5px;}
.input:focus,.textarea:focus,select:focus{outline:none;border-color:var(--steel);}
.textarea{min-height:88px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.logoup{display:flex;align-items:center;gap:16px;}
.logobox{width:96px;height:96px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--panel);overflow:hidden;flex:none;}
.logobox img{max-width:100%;max-height:100%;object-fit:contain;} .logobox span{font-size:11px;color:var(--mutd);padding:6px;text-align:center;}

.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:30px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);}
.hnode{padding:22px 24px;} .hnode.alt{text-align:right;background:linear-gradient(90deg,transparent,rgba(241,95,83,.10));}
.hk{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mutd);}
.hv{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:600;margin-top:4px;}
.hbridge{min-height:66px;width:180px;display:flex;align-items:center;justify-content:center;border-left:1px dashed var(--line);border-right:1px dashed var(--line);}
.hbridge span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);text-align:center;padding:0 10px;}

.shell{display:grid;grid-template-columns:230px 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(15,36,56,.4);}
.rail{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:3px;}
.railitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;background:none;color:var(--mut);cursor:pointer;text-align:left;font-size:13.5px;width:100%;}
.railitem:hover{background:var(--panel);} .railitem.active{background:var(--panel);color:var(--ink);}
.railitem.active .railn{color:var(--red);}
.railn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mutd);}
.raill{flex:1;} .railck{color:var(--steel);font-size:12px;}
.main{padding:24px clamp(16px,3vw,32px) 30px;}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:24px;}
.progressfill{height:100%;background:linear-gradient(90deg,var(--steel),var(--amber));transition:width .3s;}
.sechead{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px;}
.secn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--red);border:1px solid var(--line);border-radius:8px;padding:6px 9px;}

.qs{display:flex;flex-direction:column;gap:26px;margin-top:20px;}
.q{border-top:1px solid var(--line);padding-top:22px;} .q:first-child{border-top:none;padding-top:0;}
.qtext{font-size:16px;font-weight:500;margin-bottom:4px;}
.qhint{color:var(--amber);font-size:12.5px;margin:6px 0 4px;font-family:'IBM Plex Mono',monospace;}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.opt{display:flex;align-items:center;gap:11px;text-align:left;padding:12px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:14.5px;}
.opt:hover{border-color:var(--steel);} .opt.sel{border-color:var(--red);background:rgba(241,95,83,.08);}
.optdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--mutd);flex:none;}
.opt.sel .optdot{border-color:var(--red);background:var(--red);box-shadow:inset 0 0 0 2px var(--panel);}
.optbox{width:18px;height:18px;border-radius:5px;border:2px solid var(--mutd);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ground);}
.opt.sel .optbox{border-color:var(--red);background:var(--red);}
.opt.dk{border-style:dashed;color:var(--mut);}
.opt.dk.sel{border-color:var(--amber);background:rgba(251,174,64,.10);color:var(--ink);}
.opt.dk.sel .optdot{border-color:var(--amber);background:var(--amber);}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.card{padding:16px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:center;transition:border-color .12s,background .12s;}
.card:hover{border-color:var(--steel);} .card.sel{border-color:var(--red);background:rgba(241,95,83,.08);}
.cardicon{font-size:22px;margin-bottom:8px;display:block;} .cardlabel{font-size:12.5px;line-height:1.35;}

.logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px;}
.logotile{padding:14px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;}
.logotile:hover{border-color:var(--steel);} .logotile.sel{border-color:var(--red);background:rgba(241,95,83,.08);}
.logodot{width:9px;height:9px;border-radius:50%;background:var(--mutd);flex:none;} .logotile.sel .logodot{background:var(--red);}

.bool3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.b3{padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;font-size:14px;}
.b3:hover{border-color:var(--steel);} .b3.on{border-color:var(--red);background:rgba(241,95,83,.1);}
.b3.dk{border-style:dashed;color:var(--mut);font-weight:400;} .b3.dk.on{border-color:var(--amber);background:rgba(251,174,64,.10);color:var(--ink);}

.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;}
.ratebtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 5px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;}
.ratebtn:hover{border-color:var(--steel);} .ratebtn.on{border-color:var(--amber);background:rgba(251,174,64,.1);color:var(--ink);}
.raten{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;} .ratel{font-size:10px;text-align:center;line-height:1.25;}

.slwrap{margin-top:16px;}
.slrow{display:flex;align-items:center;gap:16px;}
.sl{flex:1;accent-color:var(--red);}
.slval{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;min-width:150px;text-align:right;}
.slval.big{font-size:26px;}
.slbands{display:flex;justify-content:space-between;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--mutd);}
.dkbtn{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 12px;border-radius:8px;cursor:pointer;}
.dkbtn:hover{border-color:var(--amber);color:var(--ink);} .dkbtn.on{border-color:var(--amber);background:rgba(251,174,64,.10);color:var(--ink);border-style:solid;}

.alloc{margin-top:14px;}
.allocbar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--ground);}
.allocseg{transition:width .2s;}
.allocrow{display:grid;grid-template-columns:1fr 2fr auto;gap:12px;align-items:center;margin-bottom:10px;}
.alloclabel{font-size:13.5px;display:flex;align-items:center;gap:8px;}
.allocdot{width:9px;height:9px;border-radius:2px;flex:none;}
.allocnum{font-family:'IBM Plex Mono',monospace;font-size:14px;min-width:40px;text-align:right;}
.alloctotal{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:8px;}
.alloctotal.ok{color:var(--green);} .alloctotal.off{color:var(--amber);}

.drag{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.dragitem{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);}
.dragrank{color:var(--red);font-size:14px;font-family:'IBM Plex Mono',monospace;}
.draglabel{flex:1;font-size:14.5px;}
.dragctl{display:flex;gap:4px;}
.dragctl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--ground);color:var(--mut);cursor:pointer;font-size:10px;}
.dragctl button:disabled{opacity:.3;cursor:not-allowed;}
.notebox{width:100%;min-height:80px;margin-top:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical;}
.notebox:focus{outline:none;border-color:var(--steel);}

.navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);}
.navmeta{font-size:12px;color:var(--mutd);font-family:'IBM Plex Mono',monospace;}

.panelcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px;}
.bankgrid{display:flex;flex-direction:column;gap:18px;}
.stat{display:flex;gap:26px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mut);}
.stat b{color:var(--ink);font-size:20px;font-family:'Space Grotesk',sans-serif;display:block;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
table.qtable{width:100%;border-collapse:collapse;font-size:13px;}
table.qtable th,table.qtable td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.qtable th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mutd);}
.pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;}
.jsoned{width:100%;min-height:280px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--ground);color:var(--ink);resize:vertical;white-space:pre;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--steel);color:var(--ink);padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);}

/* ===== REPORT ===== */

.orgident{display:flex;align-items:center;gap:12px;} .orgident img{height:40px;max-width:120px;object-fit:contain;}
.rbody{padding:32px 44px 40px;}

.repsec h3{font-family:'Space Grotesk',sans-serif;font-size:16px;color:#0A1826;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #E3EAF1;}

.moneybox{background:linear-gradient(135deg,#0A1826,#12304A);border-radius:12px;padding:28px 30px;color:#E8EFF6;}

function clone(o){return JSON.parse(JSON.stringify(o));}
function today(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const $=s=>document.querySelector(s); const app=$("#app");
function cur(){return (S.kb.meta.currencies.find(c=>c.id===S.org.currency)||{symbol:"£"}).symbol;}
function money(n){ if(n==null||!isFinite(n))return "—";
  const s=cur();
  if(n>=1e9)return s+(n/1e9).toFixed(1).replace(/\.0$/,"")+"bn";
  if(n>=1e6)return s+(n/1e6).toFixed(1).replace(/\.0$/,"")+"m";
  if(n>=1e3)return s+Math.round(n/1e3)+"k";
  return s+Math.round(n); }
function logVal(pos,sl){ const min=Math.log(sl.min),max=Math.log(sl.max);
  return Math.round(Math.exp(min+(max-min)*(pos/sl.steps))/10000)*10000; }
function logPos(val,sl){ const min=Math.log(sl.min),max=Math.log(sl.max);
  return Math.round(((Math.log(Math.max(sl.min,val))-min)/(max-min))*sl.steps); }

/* ---------------- scoring ---------------- */
function qScore(q,a){
  if(a===undefined||a===null)return null;
  if(a==="__DK__")return 0;
  switch(q.answer_type){
    case "single_select":{const o=q.options[a];return o&&typeof o.score==="number"?o.score:null;}
    case "multi_select":{if(!Array.isArray(a)||!a.length)return null;
      if(!q.options.some(o=>typeof o.score==="number"))return null;
      let t=0;a.forEach(i=>{const o=q.options[i];if(o&&typeof o.score==="number")t+=o.score;});
      return Math.max(0,Math.min(100,t));}
    case "boolean_dk":return a==="yes"?q.scores.yes:a==="no"?q.scores.no:q.scores.dk;
    case "rating_1_5":return ((a-1)/4)*100;
    case "slider_percent":{const sl=q.slider;let p=((a-sl.min)/(sl.max-sl.min))*100;
      if(q.invert)p=100-p;return Math.max(0,Math.min(100,p));}
    case "allocation_100":{const nb=(a&&a.nobody)||0;
      let sc=100-nb*1.6;
      const vals=Object.values(a||{});const mx=Math.max(...vals,0);
      if(mx>70)sc-=(mx-70)*0.6;
      return Math.max(0,Math.min(100,Math.round(sc)));}
    default:return null;
  }
}
function signalScores(){
  const acc={};
  S.kb.meta.signals.forEach(s=>acc[s.id]={t:0,w:0});
  S.kb.questions.forEach(q=>{
    if(!q.signals||!q.signals.length)return;
    const sc=qScore(q,S.answers[q.id]); if(sc===null)return;
    q.signals.forEach(sg=>{ if(!acc[sg.id])return; acc[sg.id].t+=sc*sg.w; acc[sg.id].w+=sg.w; });
  });
  const out={};
  S.kb.meta.signals.forEach(s=>{ out[s.id]=acc[s.id].w?Math.round(acc[s.id].t/acc[s.id].w):null; });
  return out;
}
function blindSpots(){
  const list=[];
  S.kb.questions.forEach(q=>{ if(S.answers[q.id]==="__DK__"&&q.dk_blind) list.push({q,text:q.dk_blind}); });
  const alloc=S.answers["O2"];
  if(alloc&&alloc.nobody>20) list.push({q:S.kb.questions.find(x=>x.id==="O2"),
    text:"A meaningful share of cloud cost responsibility is unassigned by the organisation's own account ("+alloc.nobody+" of 100 points)."});
  return list;
}
function annualSpend(){ const a=S.answers["E3"]; return (a===undefined||a==="__DK__")?null:a; }
function growth(){ const a=S.answers["E5"]; return a===undefined?25:a; }
function urgencyIndex(){
  let u=0;
  const g=growth(); if(g>30)u+=Math.min(28,(g-30)*0.22);
  const mig=S.answers["E6"]; if(typeof mig==="number")u+=mig*0.22;
  const je=S.answers["E4"]; if(typeof je==="number"){const o=S.kb.questions.find(q=>q.id==="E4").options[je]; u+=(o.migration_ahead||0)*18;}
  const p2=S.answers["P2"]; if(typeof p2==="number"){const o=S.kb.questions.find(q=>q.id==="P2").options[p2]; u+=(o.urgency||0);}
  const pv=S.answers["P1"]; if(typeof pv==="number")u+=Math.min(14,pv*0.28);
  const plats=S.answers["E2"];
  if(Array.isArray(plats)){const q=S.kb.questions.find(x=>x.id==="E2");
    const h=plats.filter(i=>q.options[i]&&q.options[i].hyper).length; if(h>=2)u+=8;}
  return Math.max(0,Math.min(100,Math.round(u)));
}
function gapIndex(sig){
  let t=0,w=0;
  S.kb.meta.signals.forEach(s=>{ if(sig[s.id]===null)return; t+=(100-sig[s.id])*s.weight; w+=s.weight; });
  return w?Math.round(t/w):null;
}
function needIndex(){ const sig=signalScores(); const g=gapIndex(sig);
  if(g===null)return null; return Math.round(0.6*g+0.4*urgencyIndex()); }
function wasteBand(sig){
  const v=sig.visibility, c=sig.control;
  const parts=[v,c].filter(x=>x!==null);
  const cap=parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:0;
  const band=S.kb.meta.waste_model.bands.find(b=>cap<=b.max_capability)||S.kb.meta.waste_model.bands[3];
  const mods=S.kb.meta.benchmarks.bfsi_modifiers;
  // Sector uplift reflects structural inefficiency that mature controls largely resolve,
  // so it scales inversely with demonstrated capability rather than applying flat.
  const full=mods.factors.reduce((a,f)=>a+f.pts,0);
  const uplift=full*(1-cap/100);
  return {low:band.low, high:Math.min(mods.cap, band.high+uplift), label:band.label, anchor:band.anchor, uplift, cap:Math.round(cap)};
}
function exposure(){
  const sp=annualSpend(); const sig=signalScores(); const b=wasteBand(sig);
  if(sp===null)return {band:b,y1:null,y3:null};
  const g=Math.max(0,growth())/100;
  const y1=[sp*b.low, sp*b.high];
  let cl=0,ch=0,s=sp;
  for(let i=0;i<3;i++){ cl+=s*b.low; ch+=s*b.high; s*=(1+g); }
  return {band:b,y1,y3:[cl,ch]};
}
function verdict(){ const n=needIndex(); if(n===null)return null;
  return S.kb.meta.verdict_bands.find(v=>n>=v.min&&n<=v.max)||S.kb.meta.verdict_bands[3]; }
function confidence(){
  const bs=blindSpots().length; const answered=Object.keys(S.answers).length;
  if(bs>=6||answered<12)return {label:"Low confidence",color:"#F15F53",
    note:"A high number of unknowns means these figures are directional only. A billing-data baseline is required before they can be relied upon."};
  if(bs>=3)return {label:"Moderate confidence",color:"#FBAE40",
    note:"Some inputs were unknown. Figures indicate scale rather than a validated position."};
  return {label:"Reasonable confidence",color:"#3FB98A",
    note:"Inputs were largely complete. Figures still require validation against actual billing data before use in a business case."};
}
function recommendedServices(){
  const sig=signalScores();
  let out=S.kb.meta.service_areas.filter(sa=>sa.triggers.some(t=>{
    const v=sig[t.signal]; return v!==null&&v<t.below; }));
  const order=S.answers["C4"];
  if(Array.isArray(order)){
    const q=S.kb.questions.find(x=>x.id==="C4"); const map=q.concern_map||{};
    const rank={}; order.forEach((label,i)=>{ const id=map[label]; if(id)rank[id]=i; });
    out.sort((a,b)=>(rank[a.id]!==undefined?rank[a.id]:99)-(rank[b.id]!==undefined?rank[b.id]:99));
  }
  return out;
}
function relevantCaseStudies(){
  const sig=signalScores();
  const weakest=Object.keys(sig).filter(k=>sig[k]!==null).sort((a,b)=>sig[a]-sig[b]).slice(0,3);
  const scored=S.kb.meta.case_studies.map(cs=>({cs,hits:cs.relevance.filter(r=>weakest.includes(r)).length}));
  scored.sort((a,b)=>b.hits-a.hits);
  return scored.map(x=>x.cs);
}

      +'<div class="svcdel">Representative deliverables</div><ul class="svclist">'+s.deliverables.map(d=>'<li>'+esc(d)+'</li>').join("")+'</ul></div>').join("")
    : '<p style="color:#48586A;font-size:13.5px">No service area triggered — your controls scored above threshold across every signal. A short validation review against billing data is still worthwhile before concluding no action is needed.</p>';

  const csBlock=cases.map(cs=>'<div class="cs"><div><div class="cstitle">'+esc(cs.title)+'</div>'
    +'<div class="csmeta">'+esc(cs.region)+' · '+esc(cs.industry)+' · '+esc(cs.outcome)
    +(cs.status==="placeholder"?'<span class="csph">PLACEHOLDER PDF</span>':'')+'</div></div>'
    +'<button class="csbtn no-print" data-a="dlCase" data-id="'+cs.id+'">Download PDF</button></div>').join("");

  const notes=S.answers["X1"];

  return '<div class="reportwrap">'
   +'<div class="reportbar no-print"><button class="btn ghost" data-a="goto" data-s="assess">← Edit answers</button>'
   +'<button class="btn ghost" data-a="exportRes">Export results ↓</button>'
   +'<button class="btn primary" data-a="print">Download PDF ↓</button></div>'
   +'<div class="paper"><div class="cover"><div class="covertop"><div class="coverlogo">'+ltm+'</div>'
   +'<div style="text-align:right" class="mono" style="font-size:10px"><div class="mlab">Prepared</div><div class="mline">'+esc(r.date)+'</div></div></div>'
   +'<div class="reptitle">FinOps Value Case</div><div class="repsub">Pre-maturity qualification · Indicative</div>'
   +'<div class="covermeta"><div><div class="mlab">Organisation</div><div class="orgident">'+orgId+'</div></div>'
   +'<div><div class="mlab">Completed by</div><div class="mval">'+esc(r.name||"—")+'</div><div class="mline">'+esc([r.role,r.email].filter(Boolean).join(" · "))+'</div></div></div>'
   +(o.details?'<div style="margin-top:20px"><div class="mlab">Scope</div><div class="mline">'+esc(o.details)+'</div></div>':'')
   +'</div><div class="rbody">'

   +'<div class="repsec"><h3>1 · The value at stake</h3>'+opener+moneyBlock+'</div>'

   +'<div class="repsec"><h3>2 · Verdict</h3><div class="verdictrow">'
   +'<div class="needdial" style="border-color:'+(v?v.color:"#8494A4")+'"><b style="color:'+(v?v.color:"#8494A4")+'">'+(n!==null?n:"—")+'</b><span>need index</span></div>'
   +'<div><div class="vhead">'+(v?esc(v.headline):"Not enough data")+'</div><p class="vnarr">'+(v?esc(v.narrative):"Complete more of the assessment to produce a verdict.")+'</p>'
   +'<p class="vnarr" style="margin-top:8px"><b>'+(v?esc(v.label):"")+'</b>'+(weak.length?' &middot; Weakest areas: '+esc(weak.join(" and ")):'')+'</p></div></div></div>'

   +blindBlock

   +'<div class="repsec"><h3>'+(bs.length?4:3)+' · Signal breakdown</h3>'
   +'<p style="color:#48586A;font-size:13px;margin-top:0">Higher is better. These five signals drive both the verdict and the waste band applied above.</p>'+sigBlock+'</div>'

   +'<div class="repsec"><h3>'+(bs.length?5:4)+' · Where LTM helps</h3>'
   +'<p style="color:#48586A;font-size:13.5px;margin-top:0">Ordered by the concerns you ranked highest, limited to the areas your answers actually triggered.</p>'
   +svcBlock+'</div>'

   +'<div class="repsec"><h3>'+(bs.length?6:5)+' · Relevant case studies</h3>'
   +'<p style="color:#48586A;font-size:13.5px;margin-top:0">Selected against your weakest signals.</p>'
   +'<div class="csgrid">'+csBlock+'</div></div>'

   +'<div class="repsec"><h3>'+(bs.length?7:6)+' · Next step</h3><div class="nextstep">'
   +'<div style="font-family:\'Space Grotesk\',sans-serif;font-size:17px;font-weight:600;color:#0A1826;margin-bottom:6px">A two-week FinOps baseline assessment</div>'
   +'<p style="color:#48586A;font-size:13.5px;margin:0 0 14px">Replaces every estimate in this document with a figure derived from your actual billing data. Output: a validated waste baseline, a prioritised savings backlog with owners, and a costed operating model recommendation.</p>'
   +'<div class="broch" style="background:#fff"><div><div class="brochtitle">'+esc(M.brochure.title)+(M.brochure.status==="placeholder"?'<span class="csph">PLACEHOLDER PDF</span>':'')+'</div>'
   +'<div class="brochsub">'+esc(M.brochure.subtitle)+'</div></div>'
   +'<button class="csbtn no-print" data-a="dlBrochure">Download brochure</button></div></div></div>'

   +(notes&&notes!=="__DK__"?'<div class="repsec"><h3>Respondent notes</h3><p style="color:#16202B;font-size:13.5px;background:#F5F8FB;border-left:3px solid var(--steel);padding:12px 16px;border-radius:0 6px 6px 0;margin:0">'+esc(notes)+'</p></div>':'')

   +'<div class="repsec"><h3>Basis and sources</h3>'
   +M.benchmarks.sources.map(s=>'<p style="color:#48586A;font-size:12.5px;margin:0 0 8px"><b>'+esc(s.label)+'</b> — '+esc(s.note)+'</p>').join("")
   +'<p style="color:#7089A0;font-size:12px;margin-top:12px">'+esc(M.benchmarks.honesty_note)+'</p></div>'

   +'</div><div class="repfoot">Prepared with the LTM FinOps Value Case accelerator.<div style="margin-top:8px">'+esc(M.disclaimer)+'</div></div></div></div>';
}

/* ---------------- bank ---------------- */
function viewBank(){
  const kb=S.kb;
  const rows=kb.questions.map(q=>'<tr><td class="mono">'+esc(q.id)+'</td><td>'+esc(q.section)+'</td>'
   +'<td><span class="pill">'+esc(q.answer_type)+'</span></td>'
   +'<td>'+(q.signals&&q.signals.length?q.signals.map(s=>'<span class="pill">'+esc(s.id)+' ×'+s.w+'</span>').join(" "):'<span class="pill">unscored</span>')+'</td>'
   +'<td>'+(q.allow_dk||q.answer_type==="boolean_dk"?'<span class="pill" style="color:var(--amber)">yes</span>':'')+'</td>'
   +'<td>'+esc(q.text)+'</td></tr>').join("");
  const types={}; kb.questions.forEach(q=>types[q.answer_type]=(types[q.answer_type]||0)+1);
  const bands=kb.meta.waste_model.bands.map((b,i)=>'<div class="allocrow" style="grid-template-columns:2fr 1fr 1fr"><div class="alloclabel">'+esc(b.label)+'</div>'
   +'<input class="input" style="padding:7px 10px;font-family:\'IBM Plex Mono\',monospace" type="number" step="0.01" min="0" max="1" value="'+b.low+'" data-band="'+i+'" data-f="low"/>'
   +'<input class="input" style="padding:7px 10px;font-family:\'IBM Plex Mono\',monospace" type="number" step="0.01" min="0" max="1" value="'+b.high+'" data-band="'+i+'" data-f="high"/></div>').join("");
  return '<main class="wrap"><div class="eyebrow">Admin</div><h1 class="h1 sm">Question bank</h1>'
   +'<p class="lead" style="margin-bottom:20px">Manage questions, scoring signals and the benchmark model. Export to version it, import to swap it.</p>'
   +'<div class="bankgrid">'
   +'<div class="panelcard"><div class="stat"><span><b>'+kb.questions.length+'</b>questions</span><span><b>'+Object.keys(types).length+'</b>answer formats</span>'
   +'<span><b>'+kb.questions.filter(q=>q.allow_dk||q.answer_type==="boolean_dk").length+'</b>with "don\'t know"</span>'
   +'<span><b>'+kb.meta.service_areas.length+'</b>service areas</span><span><b>'+kb.meta.case_studies.length+'</b>case studies</span></div>'
   +'<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">'+Object.keys(types).map(t=>'<span class="pill">'+esc(t)+' × '+types[t]+'</span>').join(" ")+'</div>'
   +'<div class="btnrow"><button class="btn primary sm" data-a="exKb">Export JSON ↓</button><button class="btn ghost sm" data-a="exCsv">Export CSV ↓</button>'
   +'<button class="btn ghost sm" data-a="imKb">Import JSON ↑</button><button class="btn ghost sm" data-a="setLtm">Set LTM logo</button>'
   +'<button class="btn ghost sm" data-a="resetKb">Reset to default</button></div></div>'

   +'<div class="panelcard"><h2 class="h2" style="font-size:16px;margin-bottom:4px">Benchmark model</h2>'
   +'<p class="blurb" style="margin-bottom:14px">Waste bands as decimals (0.29 = 29%). Anchored to Flexera 2026 and the 27–32% multi-year band. Edit to substitute LTM engagement data.</p>'
   +'<div class="allocrow" style="grid-template-columns:2fr 1fr 1fr;border-bottom:1px solid var(--line);padding-bottom:6px"><div class="mono" style="font-size:10px;letter-spacing:.08em;color:var(--mutd);text-transform:uppercase">Capability band</div><div class="mono" style="font-size:10px;color:var(--mutd);text-transform:uppercase">Low</div><div class="mono" style="font-size:10px;color:var(--mutd);text-transform:uppercase">High</div></div>'
   +bands
   +'<p class="blurb" style="margin-top:14px"><b>BFSI uplift applied to upper bound:</b> +'+Math.round(kb.meta.benchmarks.bfsi_modifiers.factors.reduce((a,f)=>a+f.pts,0)*100)+' pts, capped at '+Math.round(kb.meta.benchmarks.bfsi_modifiers.cap*100)+'%. '+esc(kb.meta.benchmarks.bfsi_modifiers.basis)+'</p></div>'

   +'<div class="panelcard"><h2 class="h2" style="font-size:16px;margin-bottom:12px">Questions</h2>'
   +'<div style="overflow-x:auto"><table class="qtable"><thead><tr><th>ID</th><th>Section</th><th>Format</th><th>Signals</th><th>DK</th><th>Question</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'

   +'<div class="panelcard"><h2 class="h2" style="font-size:16px;margin-bottom:6px">Advanced — edit JSON</h2>'
   +'<p class="blurb" style="margin-bottom:12px">Complete instrument: questions, signals, benchmarks, service areas, case studies and brochure paths.</p>'
   +'<textarea class="jsoned" id="jsoned" spellcheck="false">'+esc(JSON.stringify(kb,null,2))+'</textarea>'
   +'<div class="btnrow"><button class="btn primary sm" data-a="applyJson">Apply changes</button><button class="btn ghost sm" data-a="revert">Revert</button></div></div>'
   +'</div></main>';
}

/* ---------------- events ---------------- */
let tT=null;
function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=m;clearTimeout(tT);tT=setTimeout(()=>t.remove(),3000);}
function dl(name,text,type){const b=new Blob([text],{type:type||"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a],[data-nav]"); if(!el)return;
  if(el.dataset.nav){S.tab=el.dataset.nav;render();return;}
  const a=el.dataset.a, q=el.dataset.q;
  if(a==="goto"){S.tab="assessment";S.screen=el.dataset.s;render();window.scrollTo(0,0);}
  else if(a==="startAssess"){if(!S.org.name||!S.respondent.name)return;S.screen="assess";S.secIdx=0;render();window.scrollTo(0,0);}
  else if(a==="secBack"){if(S.secIdx===0)S.screen="org";else S.secIdx--;render();window.scrollTo(0,0);}
  else if(a==="secNext"){S.secIdx++;render();window.scrollTo(0,0);}
  else if(a==="gotoSec"){S.secIdx=Number(el.dataset.i);render();window.scrollTo(0,0);}
  else if(a==="goReport"){S.screen="report";render();window.scrollTo(0,0);}
  else if(a==="print"){window.print();}
  else if(a==="ansIdx"){const i=Number(el.dataset.i);if(S.answers[q]===i)delete S.answers[q];else S.answers[q]=i;render();}
  else if(a==="ansVal"){const v=el.dataset.v;if(S.answers[q]===v)delete S.answers[q];else S.answers[q]=v;render();}
  else if(a==="ansNum"){const v=Number(el.dataset.v);if(S.answers[q]===v)delete S.answers[q];else S.answers[q]=v;render();}
  else if(a==="ansDK"){if(S.answers[q]==="__DK__")delete S.answers[q];else S.answers[q]="__DK__";render();}
  else if(a==="ansMulti"){const i=Number(el.dataset.i);const qq=S.kb.questions.find(x=>x.id===q);
    let arr=Array.isArray(S.answers[q])?S.answers[q].slice():[];
    const opt=qq.options[i];
    if(opt.exclusive){ arr=arr.includes(i)?[]:[i]; }
    else { const p=arr.indexOf(i); if(p>=0)arr.splice(p,1);else arr.push(i);
      arr=arr.filter(j=>!qq.options[j].exclusive); }
    if(arr.length)S.answers[q]=arr;else delete S.answers[q]; render();}
  else if(a==="dUp"||a==="dDn"){const i=Number(el.dataset.i);const qq=S.kb.questions.find(x=>x.id===q);
    const ord=Array.isArray(S.answers[q])?S.answers[q].slice():qq.options.slice();
    const j=i+(a==="dUp"?-1:1); if(j<0||j>=ord.length)return;
    [ord[i],ord[j]]=[ord[j],ord[i]]; S.answers[q]=ord; render();}
  else if(a==="dlCase"){const cs=S.kb.meta.case_studies.find(c=>c.id===el.dataset.id);
    if(cs.status==="placeholder")toast("Placeholder — drop the approved PDF at "+cs.file);
    else window.open(cs.file,"_blank");}
  else if(a==="dlBrochure"){const b=S.kb.meta.brochure;
    if(b.status==="placeholder")toast("Placeholder — drop the brochure PDF at "+b.file);
    else window.open(b.file,"_blank");}
  else if(a==="exKb"){dl("finops-valuecase-bank-"+today()+".json",JSON.stringify(S.kb,null,2));toast("Question bank exported");}
  else if(a==="exCsv"){dl("finops-valuecase-questions-"+today()+".csv",toCsv(),"text/csv");toast("CSV exported");}
  else if(a==="imKb"){$("#fileImport").click();}
  else if(a==="resetKb"){S.kb=clone(DEFAULT_KB);S.answers={};render();toast("Reset to default");}
  else if(a==="setLtm"){$("#fileLtm").click();}
  else if(a==="applyJson"){try{const p=JSON.parse($("#jsoned").value);
    if(p&&p.meta&&Array.isArray(p.questions)){S.kb=p;S.answers={};render();toast("Applied");}
    else toast("Not a valid instrument (need meta and questions)");}catch(err){toast("Invalid JSON — "+err.message);}}
  else if(a==="revert"){render();}
  else if(a==="exportRes"){dl("finops-valuecase-results-"+today()+".json",JSON.stringify({
      org:S.org,respondent:S.respondent,answers:S.answers,
      signals:signalScores(),needIndex:needIndex(),urgency:urgencyIndex(),
      exposure:exposure(),blindSpots:blindSpots().map(b=>b.q.id),
      services:recommendedServices().map(s=>s.id)},null,2));toast("Results exported");}
  else if(a==="upOrg"){$("#fileOrg").click();}
  else if(a==="clrOrg"){S.org.logo=null;render();}
});
$("#ltmLogo").addEventListener("click",()=>$("#fileLtm").click());

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.model){const[o,k]=el.dataset.model.split(".");S[o][k]=el.value;
    const b=document.querySelector('[data-a="startAssess"]');
    if(b)b.disabled=!(S.org.name&&S.respondent.name);
    return;}
  if(el.dataset.band!==undefined){const i=Number(el.dataset.band);
    S.kb.meta.waste_model.bands[i][el.dataset.f]=Number(el.value)||0;return;}
  const q=el.dataset.q, a=el.dataset.a;
  if(a==="ansText"){if(el.value)S.answers[q]=el.value;else delete S.answers[q];return;}
  if(a==="ansCur"){const qq=S.kb.questions.find(x=>x.id===q);const v=logVal(Number(el.value),qq.slider);
    S.answers[q]=v;const lab=$("#v_"+q);if(lab)lab.textContent=money(v);return;}
  if(a==="ansSl"){const qq=S.kb.questions.find(x=>x.id===q);const v=Number(el.value);S.answers[q]=v;
    const lab=$("#v_"+q);if(lab)lab.textContent=(v>0&&qq.answer_type==="slider_signed"?"+":"")+v+(qq.slider.suffix||"");return;}
  if(a==="ansAlloc"){const b=el.dataset.b;
    const cur=(S.answers[q]&&typeof S.answers[q]==="object")?Object.assign({},S.answers[q]):{engineering:25,finance:25,central_it:25,nobody:25};
    cur[b]=Number(el.value); S.answers[q]=cur; render(); return;}
});
document.addEventListener("change",e=>{ if(e.target.dataset.model){const[o,k]=e.target.dataset.model.split(".");S[o][k]=e.target.value;render();} });

function readImg(e,which){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{if(which==="ltm")S.ltmLogo=r.result;else S.org.logo=r.result;render();toast(which==="ltm"?"LTM logo set":"Logo added");};
  r.readAsDataURL(f);e.target.value="";}
$("#fileLtm").addEventListener("change",e=>readImg(e,"ltm"));
$("#fileOrg").addEventListener("change",e=>readImg(e,"org"));
$("#fileImport").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);
    if(p&&p.meta&&Array.isArray(p.questions)){S.kb=p;S.answers={};render();toast("Instrument imported");}
    else toast("Not a valid instrument");}catch(err){toast("Import failed — invalid JSON");}e.target.value="";};
  r.readAsText(f);});

function toCsv(){
  const q2=v=>{const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=[["id","section","answer_type","signals","allow_dk","text","options"].join(",")];
  S.kb.questions.forEach(q=>{
    let opts="";
    if(Array.isArray(q.options))opts=q.options.map(o=>typeof o==="string"?o:(o.label+(o.score!=null?"::"+o.score:""))).join(" | ");
    else if(q.buckets)opts=q.buckets.map(b=>b.label).join(" | ");
    else if(q.slider)opts="min="+q.slider.min+"; max="+q.slider.max;
    rows.push([q.id,q.section,q.answer_type,(q.signals||[]).map(s=>s.id+":"+s.w).join(" "),
      (q.allow_dk||q.answer_type==="boolean_dk")?"yes":"no",q.text,opts].map(q2).join(","));
  });
  return rows.join("\n");
}
render();
</script>
